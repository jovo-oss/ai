        function toggleSmartParseMenu() {
            const menu = document.getElementById('smartParseMenu');
            if (menu) {
                menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
            }
        }
        
        async function smartParse(mode) {
            if (!currentMemoryCharacter) return;
            
            const menu = document.getElementById('smartParseMenu');
            if (menu) menu.style.display = 'none';
            
            const modeNames = {
                'auto': '⚡ 增量解析',
                'full': '🔍 全量解析'
            };
            
            const body = document.getElementById('memoryTabContent') || document.getElementById('memoryPanelBody');
            
            if (body) body.innerHTML = `
                <div style="text-align: center; padding: 60px 20px;">
                    <div style="font-size: 48px; margin-bottom: 16px; animation: spin 2s linear infinite;">🧠</div>
                    <p style="color: #a3a3a3; font-size: 16px; margin-bottom: 8px;"><b>${modeNames[mode] || '智能提取'}</b></p>
                    <p style="color: #737373; font-size: 13px;">AI正在分析聊天记录...</p>
                    <style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}/api/memory-events/smart-parse`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        character_id: currentMemoryCharacter.id,
                        user_id: USER_ID,
                        mode: mode,
                        message_count: 20
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    const errorMsg = data.detail || data.message || '服务器错误';
                    if (body) body.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px;">
                            <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                            <p style="color: #f44336; font-size: 15px;">提取失败</p>
                            <p style="color: #666; font-size: 12px; margin-top: 6px;">${errorMsg}</p>
                            <button onclick="showFootprints()" style="margin-top: 16px; background: #222; border: 1px solid #333; color: #fff; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 12px;">返回</button>
                        </div>
                    `;
                    return;
                }
                
                const created = data.events?.created || 0;
                const updated = data.events?.updated || 0;
                const relations = data.events?.relations || 0;
                const analyzed = data.parse_info?.messages_analyzed || 0;
                
                if (body) body.innerHTML = `
                    <div style="text-align: center; padding: 50px 20px;">
                        <div style="font-size: 56px; margin-bottom: 16px;">✨</div>
                        <p style="color: #10b981; font-size: 18px; font-weight: 600; margin-bottom: 12px;">提取完成！</p>
                        <div style="background: #141414; border: 1px solid #252525; border-radius: 12px; padding: 24px; max-width: 400px; margin: 20px auto;">
                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; text-align: center;">
                                <div>
                                    <div style="font-size: 28px; color: #3b82f6; font-weight: 700;">${created}</div>
                                    <div style="color: #888; font-size: 11px; margin-top: 4px;">新建</div>
                                </div>
                                <div>
                                    <div style="font-size: 28px; color: #f59e0b; font-weight: 700;">${updated}</div>
                                    <div style="color: #888; font-size: 11px; margin-top: 4px;">更新</div>
                                </div>
                                <div>
                                    <div style="font-size: 28px; color: #a78bfa; font-weight: 700;">${relations}</div>
                                    <div style="color: #888; font-size: 11px; margin-top: 4px;">关系</div>
                                </div>
                            </div>
                        </div>
                        <p style="color: #555; font-size: 12px; margin-top: 12px;">分析了 ${analyzed} 条聊天记录</p>
                        <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                            <button onclick="refreshFootprintGraph(); showFootprints();" style="background: linear-gradient(135deg, #2563eb, #7c3aed); border: none; color: #fff; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">🎯 查看知识图谱</button>
                            <button onclick="smartParse('${mode}')" style="background: transparent; border: 1px solid #444; color: #999; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 12px;" onmouseover="this.style.borderColor='#666'; this.style.color='#fff'" onmouseout="this.style.borderColor='#444'; this.style.color='#999'">🔄 再次提取</button>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('智能提取失败:', error);
                if (body) body.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                        <p style="color: #f44336; font-size: 14px;">提取出错</p>
                        <p style="color: #666; font-size: 12px; margin-top: 6px;">${error.message}</p>
                        <button onclick="showFootprints()" style="margin-top: 16px; background: #222; border: 1px solid #333; color: #fff; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 12px;">返回</button>
                    </div>
                `;
            }
        }
        
        async function renderFootprintGraph() {
            const container = document.getElementById('footprintGraphView');
            if (!container || !currentMemoryCharacter) return;
            
            container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">🔄 加载知识图谱...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/memory-events/graph/${currentMemoryCharacter.id}?user_id=${USER_ID}`);
                const data = await response.json();
                
                if (!data.success || !data.nodes || data.nodes.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 80px 20px; color: #555;">
                            <div style="font-size: 48px; margin-bottom: 16px; opacity: 0.4;">🔗</div>
                            <p style="font-size: 15px; color: #666; font-weight: 500;">暂无足迹图谱</p>
                            <p style="font-size: 12px; color: #444; margin-top: 8px;">点击"添加"或"AI提取"开始构建你的冒险知识网络</p>
                        </div>
                    `;
                    return;
                }
                
                const nodes = data.nodes;
                const links = data.links;
                const layers = data.layers || {};
                const legend = data.legend || {};
                const statistics = data.statistics || {};
                
                const LAYER_ORDER = ['location', 'person', 'item', 'discovery', 'main', 'side'];
                const LAYER_LABELS = {'location': '地点', 'person': '人物', 'item': '物品', 'discovery': '发现', 'main': '主线事件', 'side': '支线事件'};
                const LAYER_COLORS = {'location': '#fbbf24', 'person': '#60a5fa', 'item': '#34d399', 'discovery': '#a78bfa', 'main': '#f87171', 'side': '#94a3b8'};
                
                let activeFilters = new Set(LAYER_ORDER);
                let searchKeyword = '';
                let selectedNodeId = null;
                
                const NODE_W = 140;
                const NODE_H = 52;
                const LAYER_GAP = 120;
                const NODE_GAP = 20;
                const PADDING_X = 80;
                const PADDING_Y = 80;
                
                function computeLayout() {
                    const filtered = nodes.filter(n => activeFilters.has(n.type) && (!searchKeyword || n.title.toLowerCase().includes(searchKeyword.toLowerCase()) || (n.description || '').toLowerCase().includes(searchKeyword.toLowerCase())));
                    
                    const layerGroups = {};
                    LAYER_ORDER.forEach(lt => { layerGroups[lt] = []; });
                    filtered.forEach(n => {
                        if (layerGroups[n.type]) layerGroups[n.type].push(n);
                    });
                    
                    const activeLayers = LAYER_ORDER.filter(lt => layerGroups[lt].length > 0);
                    const totalH = PADDING_Y * 2 + activeLayers.length * (NODE_H + LAYER_GAP);
                    const maxPerRow = Math.max(...activeLayers.map(lt => layerGroups[lt].length), 1);
                    const totalW = Math.max(800, PADDING_X * 2 + maxPerRow * (NODE_W + NODE_GAP));
                    
                    const positions = {};
                    let y = PADDING_Y;
                    
                    activeLayers.forEach((lt, li) => {
                        const group = layerGroups[lt];
                        const rowW = group.length * (NODE_W + NODE_GAP) - NODE_GAP;
                        const startX = (totalW - rowW) / 2;
                        
                        group.forEach((n, ni) => {
                            positions[n.id] = {
                                x: startX + ni * (NODE_W + NODE_GAP),
                                y: y,
                                cx: startX + ni * (NODE_W + NODE_GAP) + NODE_W / 2,
                                cy: y + NODE_H / 2
                            };
                        });
                        
                        y += NODE_H + LAYER_GAP;
                    });
                    
                    return { positions, totalW, totalH, activeLayers, layerGroups, filtered };
                }
                
                function orthogonalPath(x1, y1, x2, y2, offset) {
                    const midY = (y1 + y2) / 2;
                    const dx = offset || 0;
                    return `M${x1},${y1} V${midY + dx} H${x2} V${y2}`;
                }
                
                function render() {
                    const { positions, totalW, totalH, activeLayers, layerGroups, filtered } = computeLayout();
                    
                    container.innerHTML = '';
                    
                    const wrapper = document.createElement('div');
                    wrapper.style.cssText = 'position: relative; width: 100%;';
                    
                    const toolbar = document.createElement('div');
                    toolbar.style.cssText = 'display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #111; border: 1px solid #222; border-radius: 8px 8px 0 0; flex-wrap: wrap;';
                    
                    const searchBox = document.createElement('input');
                    searchBox.type = 'text';
                    searchBox.placeholder = '🔍 搜索节点...';
                    searchBox.value = searchKeyword;
                    searchBox.style.cssText = 'flex: 1; min-width: 120px; max-width: 200px; padding: 6px 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #e5e5e5; font-size: 12px; outline: none;';
                    searchBox.oninput = (e) => { searchKeyword = e.target.value; render(); };
                    searchBox.onkeydown = (e) => e.stopPropagation();
                    
                    toolbar.appendChild(searchBox);
                    
                    LAYER_ORDER.forEach(lt => {
                        if (!layers[lt]) return;
                        const btn = document.createElement('button');
                        const isActive = activeFilters.has(lt);
                        btn.style.cssText = `padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.15s; border: 1px solid ${isActive ? LAYER_COLORS[lt] : '#333'}; background: ${isActive ? LAYER_COLORS[lt] + '22' : 'transparent'}; color: ${isActive ? LAYER_COLORS[lt] : '#666'};`;
                        btn.textContent = `${legend.types?.[lt]?.icon || ''} ${LAYER_LABELS[lt]} (${layers[lt].count})`;
                        btn.onclick = () => {
                            if (activeFilters.has(lt)) activeFilters.delete(lt); else activeFilters.add(lt);
                            render();
                        };
                        toolbar.appendChild(btn);
                    });
                    
                    const statsSpan = document.createElement('span');
                    statsSpan.style.cssText = 'margin-left: auto; font-size: 10px; color: #555;';
                    statsSpan.textContent = `${filtered.length} 节点 · ${statistics.totalLinks || 0} 关系`;
                    toolbar.appendChild(statsSpan);
                    
                    wrapper.appendChild(toolbar);
                    
                    const svgContainer = document.createElement('div');
                    svgContainer.style.cssText = `overflow: auto; max-height: 600px; background: #08080a; border: 1px solid #1a1a1e; border-top: none; border-radius: 0 0 8px 8px;`;
                    
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('width', totalW);
                    svg.setAttribute('height', totalH + 40);
                    svg.setAttribute('style', 'display: block;');
                    
                    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                    defs.innerHTML = `
                        <filter id="circuitGlow">
                            <feGaussianBlur stdDeviation="3" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                        <filter id="nodeShadow">
                            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
                        </filter>
                    `;
                    svg.appendChild(defs);
                    
                    const gridG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    gridG.setAttribute('opacity', '0.06');
                    for (let gx = 0; gx < totalW; gx += 20) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', gx); line.setAttribute('y1', 0);
                        line.setAttribute('x2', gx); line.setAttribute('y2', totalH + 40);
                        line.setAttribute('stroke', '#fff'); line.setAttribute('stroke-width', '0.5');
                        gridG.appendChild(line);
                    }
                    for (let gy = 0; gy < totalH + 40; gy += 20) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', 0); line.setAttribute('y1', gy);
                        line.setAttribute('x2', totalW); line.setAttribute('y2', gy);
                        line.setAttribute('stroke', '#fff'); line.setAttribute('stroke-width', '0.5');
                        gridG.appendChild(line);
                    }
                    svg.appendChild(gridG);
                    
                    activeLayers.forEach((lt, li) => {
                        const group = layerGroups[lt];
                        if (group.length === 0) return;
                        const firstPos = positions[group[0].id];
                        const layerY = firstPos.y - 20;
                        
                        const layerBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        layerBg.setAttribute('x', 10); layerBg.setAttribute('y', layerY - 8);
                        layerBg.setAttribute('width', totalW - 20); layerBg.setAttribute('height', NODE_H + 16);
                        layerBg.setAttribute('rx', '6');
                        layerBg.setAttribute('fill', LAYER_COLORS[lt]);
                        layerBg.setAttribute('opacity', '0.04');
                        svg.appendChild(layerBg);
                        
                        const layerLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        layerLabel.setAttribute('x', 20); layerLabel.setAttribute('y', layerY + 2);
                        layerLabel.setAttribute('fill', LAYER_COLORS[lt]);
                        layerLabel.setAttribute('opacity', '0.5');
                        layerLabel.setAttribute('font-size', '10');
                        layerLabel.setAttribute('font-weight', '600');
                        layerLabel.setAttribute('letter-spacing', '2');
                        layerLabel.textContent = `▸ ${LAYER_LABELS[lt]} LAYER`;
                        svg.appendChild(layerLabel);
                    });
                    
                    const linkG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    let linkOffset = 0;
                    
                    links.forEach(link => {
                        const srcPos = positions[link.source];
                        const tgtPos = positions[link.target];
                        if (!srcPos || !tgtPos) return;
                        
                        const isHighlighted = selectedNodeId && (link.source === selectedNodeId || link.target === selectedNodeId);
                        const opacity = selectedNodeId ? (isHighlighted ? 0.9 : 0.1) : 0.5;
                        const strokeWidth = isHighlighted ? 2.5 : 1.5;
                        
                        const x1 = srcPos.cx;
                        const y1 = srcPos.y + NODE_H;
                        const x2 = tgtPos.cx;
                        const y2 = tgtPos.y;
                        
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const dx = (linkOffset % 3 - 1) * 15;
                        linkOffset++;
                        path.setAttribute('d', orthogonalPath(x1, y1, x2, y2, dx));
                        path.setAttribute('fill', 'none');
                        path.setAttribute('stroke', link.color);
                        path.setAttribute('stroke-width', strokeWidth);
                        path.setAttribute('opacity', opacity);
                        if (link.dashed) path.setAttribute('stroke-dasharray', '6,3');
                        linkG.appendChild(path);
                        
                        if (isHighlighted) {
                            const glowPath = path.cloneNode();
                            glowPath.setAttribute('filter', 'url(#circuitGlow)');
                            glowPath.setAttribute('stroke-width', '4');
                            glowPath.setAttribute('opacity', '0.3');
                            linkG.insertBefore(glowPath, path);
                        }
                        
                        const midY = (y1 + y2) / 2 + dx;
                        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        dot.setAttribute('cx', x1); dot.setAttribute('cy', y1);
                        dot.setAttribute('r', '3');
                        dot.setAttribute('fill', link.color);
                        dot.setAttribute('opacity', opacity);
                        linkG.appendChild(dot);
                        
                        const dot2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        dot2.setAttribute('cx', x2); dot2.setAttribute('cy', y2);
                        dot2.setAttribute('r', '3');
                        dot2.setAttribute('fill', link.color);
                        dot2.setAttribute('opacity', opacity);
                        linkG.appendChild(dot2);
                        
                        if (isHighlighted && link.relationLabel) {
                            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                            label.setAttribute('x', (x1 + x2) / 2);
                            label.setAttribute('y', midY - 5);
                            label.setAttribute('text-anchor', 'middle');
                            label.setAttribute('fill', link.color);
                            label.setAttribute('font-size', '9');
                            label.setAttribute('opacity', '0.9');
                            label.textContent = link.relationLabel;
                            linkG.appendChild(label);
                        }
                    });
                    svg.appendChild(linkG);
                    
                    const nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    
                    filtered.forEach(node => {
                        const pos = positions[node.id];
                        if (!pos) return;
                        
                        const isSelected = selectedNodeId === node.id;
                        const isRelated = selectedNodeId && links.some(l => 
                            (l.source === selectedNodeId && l.target === node.id) || 
                            (l.target === selectedNodeId && l.source === node.id)
                        );
                        const dimmed = selectedNodeId && !isSelected && !isRelated;
                        
                        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                        g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
                        g.style.cursor = 'pointer';
                        
                        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        rect.setAttribute('width', NODE_W);
                        rect.setAttribute('height', NODE_H);
                        rect.setAttribute('rx', '6');
                        rect.setAttribute('fill', isSelected ? '#1a1a2e' : '#0f0f14');
                        rect.setAttribute('stroke', node.color);
                        rect.setAttribute('stroke-width', isSelected ? '2.5' : '1.5');
                        rect.setAttribute('opacity', dimmed ? '0.3' : '1');
                        if (isSelected) rect.setAttribute('filter', 'url(#nodeShadow)');
                        g.appendChild(rect);
                        
                        const topBar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        topBar.setAttribute('x', '6'); topBar.setAttribute('y', '2');
                        topBar.setAttribute('width', NODE_W - 12); topBar.setAttribute('height', '2');
                        topBar.setAttribute('rx', '1');
                        topBar.setAttribute('fill', node.color);
                        topBar.setAttribute('opacity', dimmed ? '0.2' : '0.6');
                        g.appendChild(topBar);
                        
                        const icon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        icon.setAttribute('x', '12'); icon.setAttribute('y', '24');
                        icon.setAttribute('font-size', '14');
                        icon.setAttribute('opacity', dimmed ? '0.3' : '1');
                        icon.textContent = node.icon;
                        g.appendChild(icon);
                        
                        const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        title.setAttribute('x', '30'); title.setAttribute('y', '22');
                        title.setAttribute('fill', '#e5e5e5');
                        title.setAttribute('font-size', '11');
                        title.setAttribute('font-weight', '500');
                        title.setAttribute('opacity', dimmed ? '0.3' : '1');
                        const maxChars = 10;
                        title.textContent = node.title.length > maxChars ? node.title.substring(0, maxChars) + '…' : node.title;
                        g.appendChild(title);
                        
                        const typeTag = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        typeTag.setAttribute('x', '30'); typeTag.setAttribute('y', '38');
                        typeTag.setAttribute('fill', node.color);
                        typeTag.setAttribute('font-size', '9');
                        typeTag.setAttribute('opacity', dimmed ? '0.2' : '0.7');
                        typeTag.textContent = `${node.typeLabel} ★${node.importance}`;
                        g.appendChild(typeTag);
                        
                        const pin1 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        pin1.setAttribute('x', NODE_W / 2 - 6); pin1.setAttribute('y', NODE_H);
                        pin1.setAttribute('width', '4'); pin1.setAttribute('height', '6');
                        pin1.setAttribute('fill', node.color);
                        pin1.setAttribute('opacity', dimmed ? '0.2' : '0.5');
                        pin1.setAttribute('rx', '1');
                        g.appendChild(pin1);
                        
                        const pin2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        pin2.setAttribute('x', NODE_W / 2 + 2); pin2.setAttribute('y', NODE_H);
                        pin2.setAttribute('width', '4'); pin2.setAttribute('height', '6');
                        pin2.setAttribute('fill', node.color);
                        pin2.setAttribute('opacity', dimmed ? '0.2' : '0.5');
                        pin2.setAttribute('rx', '1');
                        g.appendChild(pin2);
                        
                        const pin3 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        pin3.setAttribute('x', NODE_W / 2 - 6); pin3.setAttribute('y', '-6');
                        pin3.setAttribute('width', '4'); pin3.setAttribute('height', '6');
                        pin3.setAttribute('fill', node.color);
                        pin3.setAttribute('opacity', dimmed ? '0.2' : '0.5');
                        pin3.setAttribute('rx', '1');
                        g.appendChild(pin3);
                        
                        const pin4 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        pin4.setAttribute('x', NODE_W / 2 + 2); pin4.setAttribute('y', '-6');
                        pin4.setAttribute('width', '4'); pin4.setAttribute('height', '6');
                        pin4.setAttribute('fill', node.color);
                        pin4.setAttribute('opacity', dimmed ? '0.2' : '0.5');
                        pin4.setAttribute('rx', '1');
                        g.appendChild(pin4);
                        
                        g.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (selectedNodeId === node.id) {
                                selectedNodeId = null;
                            } else {
                                selectedNodeId = node.id;
                            }
                            render();
                        });
                        
                        g.addEventListener('dblclick', (e) => {
                            e.stopPropagation();
                            showFootprintDetail(node.eventId);
                        });
                        
                        nodeG.appendChild(g);
                    });
                    svg.appendChild(nodeG);
                    
                    svgContainer.appendChild(svg);
                    wrapper.appendChild(svgContainer);
                    
                    if (selectedNodeId) {
                        const selNode = nodes.find(n => n.id === selectedNodeId);
                        if (selNode) {
                            const relatedLinks = links.filter(l => l.source === selectedNodeId || l.target === selectedNodeId);
                            const detailPanel = document.createElement('div');
                            detailPanel.style.cssText = 'margin-top: 8px; background: #0f0f14; border: 1px solid #1e1e24; border-radius: 8px; padding: 14px 16px;';
                            
                            const relHtml = relatedLinks.slice(0, 8).map(l => {
                                const isSource = l.source === selectedNodeId;
                                const otherId = isSource ? l.target : l.source;
                                const otherNode = nodes.find(n => n.id === otherId);
                                if (!otherNode) return '';
                                const arrow = isSource ? '→' : '←';
                                return `<div style="display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #1a1a1e;">
                                    <span style="color: ${l.color}; font-size: 10px; min-width: 50px;">${arrow} ${l.relationLabel}</span>
                                    <span style="font-size: 12px;">${otherNode.icon} ${otherNode.title}</span>
                                </div>`;
                            }).join('');
                            
                            detailPanel.innerHTML = `
                                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                                    <span style="font-size: 22px;">${selNode.icon}</span>
                                    <div style="flex: 1;">
                                        <div style="font-size: 14px; font-weight: 600; color: #e5e5e5;">${selNode.title}</div>
                                        <div style="display: flex; gap: 8px; margin-top: 3px;">
                                            <span style="color: ${selNode.color}; background: ${selNode.color}18; padding: 1px 8px; border-radius: 3px; font-size: 10px;">${selNode.typeLabel}</span>
                                            <span style="color: #666; font-size: 10px;">★ ${selNode.importance}</span>
                                        </div>
                                    </div>
                                    <button onclick="window._graphSetSelectedNodeId(null);" style="background: none; border: 1px solid #333; color: #666; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">✕</button>
                                </div>
                                ${selNode.description ? `<div style="color: #999; font-size: 12px; line-height: 1.5; margin-bottom: 8px; padding: 8px; background: #0a0a0e; border-radius: 4px; border-left: 2px solid ${selNode.color}33;">${selNode.description}</div>` : ''}
                                ${selNode.tags && selNode.tags.length > 0 ? `<div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px;">${selNode.tags.map(t => `<span style="background: #1a1a1e; padding: 2px 8px; border-radius: 3px; font-size: 10px; color: #888;">#${t}</span>`).join('')}</div>` : ''}
                                ${relHtml ? `<div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e1e24;"><div style="font-size: 10px; color: #555; margin-bottom: 6px;">关联关系 (${relatedLinks.length})</div>${relHtml}</div>` : ''}
                            `;
                            wrapper.appendChild(detailPanel);
                        }
                    }
                    
                    const legendPanel = document.createElement('div');
                    legendPanel.style.cssText = 'margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 12px; background: #0a0a0e; border: 1px solid #1a1a1e; border-radius: 6px;';
                    
                    if (legend.relations) {
                        Object.entries(legend.relations).forEach(([key, val]) => {
                            const item = document.createElement('span');
                            item.style.cssText = `display: flex; align-items: center; gap: 4px; font-size: 10px; color: #666;`;
                            const lineStyle = val.dashed ? 'dashed' : 'solid';
                            item.innerHTML = `<span style="display: inline-block; width: 20px; height: 0; border-top: 2px ${lineStyle} ${val.color};"></span> ${val.label}`;
                            legendPanel.appendChild(item);
                        });
                    }
                    wrapper.appendChild(legendPanel);
                    
                    container.appendChild(wrapper);
                    
                    window._graphRender = render;
                    window._graphSelectedNodeId = () => selectedNodeId;
                    window._graphSetSelectedNodeId = (id) => { selectedNodeId = id; render(); };
                }
                
                render();
                
            } catch (error) {
                console.error('渲染足迹图谱失败:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #f44336;">
                        <div style="font-size: 36px; margin-bottom: 12px;">⚠️</div>
                        <p style="font-size: 14px;">图谱加载失败</p>
                        <p style="font-size: 12px; color: #666; margin-top: 6px;">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function toggleFootprintConfig() {
            const panel = document.getElementById('footprintConfigPanel');
            if (panel) {
                const isHidden = panel.style.display === 'none';
                panel.style.display = isHidden ? 'block' : 'none';
            }
        }
        
        function toggleLocation(locationId) {
            if (expandedLocations.has(locationId)) {
                expandedLocations.delete(locationId);
            } else {
                expandedLocations.add(locationId);
            }
            showFootprints();
        }
        
        function addEventAtLocation(locationId, locationTitle) {
            if (!currentMemoryCharacter) return;
            
            const targetContainer = document.getElementById('memoryTabContent') || document.getElementById('memoryPanelBody');
            targetContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="form-btn" onclick="showFootprints()" style="padding: 6px 12px; font-size: 12px;">
                            ← 返回
                        </button>
                        <h3 style="margin: 0; font-size: 14px; color: #e5e5e5;">在 ${locationTitle} 添加事件</h3>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">事件标题</label>
                    <input type="text" id="footprintTitleInput" class="form-input" placeholder="事件发生了什么">
                </div>
                
                <div class="form-group">
                    <label class="form-label">事件描述</label>
                    <textarea id="footprintDescInput" class="form-input" rows="4" placeholder="详细描述这个事件"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">事件类型</label>
                    <select id="footprintTypeSelect" class="form-input">
                        <option value="main">🎯 主线事件</option>
                        <option value="side">📌 支线事件</option>
                        <option value="discovery">🔍 发现</option>
                        <option value="item">🎒 物品</option>
                        <option value="person">👤 人物</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">重要程度 (1-10)</label>
                    <input type="number" id="footprintImportanceInput" class="form-input" value="5" min="1" max="10">
                </div>
                
                <button class="form-btn primary" onclick="createEventAtLocation(${locationId})" style="width: 100%;">
                    创建事件
                </button>
            `;
        }
        
        async function createEventAtLocation(locationId) {
            if (!currentMemoryCharacter) return;
            
            const title = document.getElementById('footprintTitleInput').value.trim();
            const description = document.getElementById('footprintDescInput').value.trim();
            const eventType = document.getElementById('footprintTypeSelect').value;
            const importance = parseInt(document.getElementById('footprintImportanceInput').value) || 5;
            
            if (!title) {
                showToast('请输入事件标题', 'error');
                return;
            }
            
            let tags = [];

        function showModelSelectModal(models, modelType) {
            const typeNames = {
                'chat': '对话模型',
                'embedding': '嵌入模型',
                'summary': '总结模型',
                'tts': '语音模型',
                'image': '生图模型',
                'vision': '视觉模型',
                'speech': '语音识别模型'
            };
            
            // 存储模型列表用于搜索
            currentModelsList = models;
            
            const modal = document.getElementById('modelSelectModal');
            const title = document.getElementById('modelSelectTitle');
            const searchInput = document.getElementById('modelSearchInput');
            
            title.textContent = `选择${typeNames[modelType]} (${models.length}个)`;
            searchInput.value = '';
            
            // 渲染模型列表
            renderModelSelectList(models);
            
            // 显示模态框
            modal.classList.add('show');
            document.getElementById('modelOverlay').classList.add('show');
            
            // 聚焦搜索框
            setTimeout(() => searchInput.focus(), 100);
        }
        
        function renderModelSelectList(models, filter = '') {
            const listContainer = document.getElementById('modelSelectList');
            const filteredModels = filter 
                ? models.filter(m => {
                    const modelId = m.id || m;
                    return modelId.toLowerCase().includes(filter.toLowerCase());
                })
                : models;
            
            let html = '<div class="model-select-list">';
            
            for (const model of filteredModels) {
                const modelId = model.id || model;
                html += `
                    <div class="model-select-item" onclick="selectModelFromList('${modelId}')">
                        <div class="model-select-name">${modelId}</div>
                        <button class="model-select-copy" onclick="event.stopPropagation(); copyModelId('${modelId}')" title="复制模型ID">
                            📋
                        </button>
                    </div>
                `;
            }
            
            if (filteredModels.length === 0) {
                html += '<div style="text-align: center; color: #737373; padding: 40px 0;">没有找到匹配的模型</div>';
            }
            
            html += '</div>';
            listContainer.innerHTML = html;
        }
        
        function selectModelFromList(modelId) {
            if (currentModelTargetInput) {
                document.getElementById(currentModelTargetInput).value = modelId;
            }
            closeModelSelectModal();
            showToast(`已选择模型：${modelId}`, 'success');
        }
        
        function copyModelId(modelId) {
            navigator.clipboard.writeText(modelId).then(() => {
                showToast('已复制到剪贴板', 'success');
            }).catch(() => {
                showToast('复制失败', 'error');
            });
        }

            const panels = ['modelPanel', 'characterPanel', 'worldbookPanel', 'settingsPanel', 'helpPanel', 'apiConfigPanel', 'providerSelectPanel'];
            const anyPanelOpen = panels.some(id => {
                const panel = document.getElementById(id);
                return panel && panel.classList.contains('show');
            });
            if (!anyPanelOpen) {
                document.getElementById('modelOverlay').classList.remove('show');
            }
        }

        function getRepeatText(repeatType, repeatDays) {
            const typeMap = {
                'once': '仅一次',
                'daily': '每天重复',
                'weekly': '每周重复',
                'custom': '自定义重复'
            };
            
            let text = typeMap[repeatType] || repeatType;
            
            if (repeatType === 'custom' && repeatDays && repeatDays.length > 0) {
                const dayNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
                const selectedDays = repeatDays.map(d => dayNames[d]).join(', ');
                text += ' (' + selectedDays + ')';
            }
            
            return text;
        }

                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">模板名称</label>
                        <input type="text" id="templateName" class="form-input" placeholder="例如：沉浸式对话">
                    </div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">描述（可选）</label>
                        <input type="text" id="templateDescription" class="form-input" placeholder="简短描述这个提示词的作用">
                    </div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">提示词类型</label>
                        <select id="templateType" class="form-input">
                            <option value="experience">✨ 体验感</option>
                            <option value="roleplay">🎭 角色扮演</option>
                            <option value="emotion">💝 情感表达</option>
                            <option value="action">🎬 动作描写</option>
                            <option value="dialogue">💬 对话风格</option>
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">提示词内容</label>
                        <textarea id="templateContent" class="form-input" rows="6" placeholder="例如：请在回复中加入细腻的情感描写，使用括号描述角色的表情和动作，让对话更加生动自然。"></textarea>
                    </div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">优先级 (1-5)</label>
                        <input type="number" id="templatePriority" class="form-input" value="1" min="1" max="5">
                    </div>
                    
                    <div style="display: flex; gap: 8px;">
                        <button onclick="savePromptTemplate()" class="form-btn" style="flex: 1; padding: 10px; background: linear-gradient(135deg, #8b5cf6, #6d28d9);">
                            保存
                        </button>
                        <button onclick="renderPromptTemplateSettings()" class="form-btn" style="flex: 1; padding: 10px; background: #262626;">
                            取消
                        </button>
                    </div>
                </div>
            `;
        }
        
        async function savePromptTemplate() {
            const name = document.getElementById('templateName').value.trim();
            const description = document.getElementById('templateDescription').value.trim();
            const templateType = document.getElementById('templateType').value;
            const content = document.getElementById('templateContent').value.trim();
            const priority = parseInt(document.getElementById('templatePriority').value);
            
            if (!name || !content) {
                showToast('请填写模板名称和提示词内容', 'warning');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/prompt-templates/?user_id=${USER_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        description: description,
                        template_type: templateType,
                        content: content,
                        priority: priority
                    })
                });
                
                if (response.ok) {
                    showToast('提示词模板已添加', 'success');
                    renderPromptTemplateSettings();
                } else {
                    showToast('保存失败', 'error');
                }
            } catch (error) {
                showToast('保存失败: ' + error.message, 'error');
            }
        }
        
        async function togglePromptTemplate(templateId, isEnabled) {
            try {
                const response = await fetch(`${API_BASE}/api/prompt-templates/${templateId}?user_id=${USER_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        is_enabled: isEnabled
                    })
                });
                
                if (response.ok) {
                    showToast(isEnabled ? '已启用' : '已禁用', 'success');
                    renderPromptTemplateSettings();
                } else {
                    showToast('操作失败', 'error');
                }
            } catch (error) {
                showToast('操作失败: ' + error.message, 'error');
            }
        }
        
        async function deletePromptTemplate(templateId) {
            if (!confirm('确定要删除这个提示词模板吗？')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/prompt-templates/${templateId}?user_id=${USER_ID}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showToast('提示词模板已删除', 'success');
                    renderPromptTemplateSettings();
                } else {
                    showToast('删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败: ' + error.message, 'error');
            }
        }
        
        async function editPromptTemplate(templateId) {
            try {
                const response = await fetch(`${API_BASE}/api/prompt-templates/${templateId}?user_id=${USER_ID}`);
                const template = await response.json();
                
                const body = document.getElementById('promptTemplatePanelBody');
                body.innerHTML = `
                    <div style="background: #171717; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
                        <h3 style="font-size: 14px; margin-bottom: 12px; color: #e5e5e5;">编辑提示词模板</h3>
                        
                        <div style="margin-bottom: 12px;">
                            <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">模板名称</label>
                            <input type="text" id="templateName" class="form-input" value="${template.name}">
                        </div>
                        
                        <div style="margin-bottom: 12px;">
                            <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">描述（可选）</label>
                            <input type="text" id="templateDescription" class="form-input" value="${template.description || ''}">
                        </div>
                        
                        <div style="margin-bottom: 12px;">
                            <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">提示词类型</label>
                            <select id="templateType" class="form-input">
                                <option value="experience" ${template.template_type === 'experience' ? 'selected' : ''}>✨ 体验感</option>
                                <option value="roleplay" ${template.template_type === 'roleplay' ? 'selected' : ''}>🎭 角色扮演</option>
                                <option value="emotion" ${template.template_type === 'emotion' ? 'selected' : ''}>💝 情感表达</option>
                                <option value="action" ${template.template_type === 'action' ? 'selected' : ''}>🎬 动作描写</option>
                                <option value="dialogue" ${template.template_type === 'dialogue' ? 'selected' : ''}>💬 对话风格</option>
                            </select>
                        </div>
                        
                        <div style="margin-bottom: 12px;">
                            <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">提示词内容</label>
                            <textarea id="templateContent" class="form-input" rows="6">${template.content}</textarea>
                        </div>
                        
                        <div style="margin-bottom: 12px;">
                            <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">优先级 (1-5)</label>
                            <input type="number" id="templatePriority" class="form-input" value="${template.priority}" min="1" max="5">
                        </div>
                        
                        <div style="display: flex; gap: 8px;">
                            <button onclick="updatePromptTemplate(${templateId})" class="form-btn" style="flex: 1; padding: 10px; background: linear-gradient(135deg, #8b5cf6, #6d28d9);">
                                更新
                            </button>
                            <button onclick="renderPromptTemplateSettings()" class="form-btn" style="flex: 1; padding: 10px; background: #262626;">
                                取消
                            </button>
                        </div>
                    </div>
                `;
            } catch (error) {
                showToast('加载失败: ' + error.message, 'error');
            }
        }
        
        async function updatePromptTemplate(templateId) {
            const name = document.getElementById('templateName').value.trim();
            const description = document.getElementById('templateDescription').value.trim();
            const templateType = document.getElementById('templateType').value;
            const content = document.getElementById('templateContent').value.trim();
            const priority = parseInt(document.getElementById('templatePriority').value);
            
            if (!name || !content) {
                showToast('请填写模板名称和提示词内容', 'warning');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/prompt-templates/${templateId}?user_id=${USER_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        description: description,
                        template_type: templateType,
                        content: content,
                        priority: priority
                    })
                });
                
                if (response.ok) {
                    showToast('提示词模板已更新', 'success');
                    renderPromptTemplateSettings();
                } else {
                    showToast('更新失败', 'error');
                }
            } catch (error) {
                showToast('更新失败: ' + error.message, 'error');
            }
        }
        
        async function renderCareReminderSettings() {
            const body = document.getElementById('careReminderPanelBody');
            body.innerHTML = '<p style="text-align: center; color: #737373;">加载中...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/proactive/care-reminders/${USER_ID}`);
                const data = await response.json();
                
                let html = `
                    <div style="margin-bottom: 20px;">
                        <button class="form-btn" onclick="showAddCareReminderForm()" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981, #059669);">
                            + 添加关怀提醒
                        </button>
                    </div>
                    <div id="careReminderList">
                `;
                
                if (data.success && data.reminders && data.reminders.length > 0) {
                    for (const reminder of data.reminders) {
                        html += `
                            <div style="background: #171717; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #262626;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <div style="font-size: 14px; font-weight: 600; color: #e5e5e5;">
                                            ${getCareTypeIcon(reminder.care_type)} ${reminder.reminder_time}
                                        </div>
                                        <div style="font-size: 12px; color: #a3a3a3; margin-top: 4px;">
                                            ${reminder.character_name || '默认角色'} · ${getRepeatTypeText(reminder.repeat_type)}
                                        </div>
                                    </div>
                                    <div style="display: flex; gap: 8px;">
                                        <button onclick="toggleCareReminder(${reminder.id}, ${!reminder.is_enabled})" 
                                                style="padding: 4px 8px; background: ${reminder.is_enabled ? '#10b981' : '#6b7280'}; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">
                                            ${reminder.is_enabled ? '启用' : '禁用'}
                                        </button>
                                        <button onclick="deleteCareReminder(${reminder.id})" 
                                                style="padding: 4px 8px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px;">
                                            删除
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    html += '<p style="text-align: center; color: #737373; padding: 20px;">暂无关怀提醒设置</p>';
                }
                
                html += '</div>';
                body.innerHTML = html;
                
            } catch (error) {
                body.innerHTML = '<p style="color: #f44336;">加载失败: ' + error.message + '</p>';
            }
        }
        
        function getCareTypeIcon(type) {
            const icons = {
                'water': '💧 喝水',
                'rest': '😌 休息',
                'exercise': '🏃 运动',
                'eye': '👁️ 护眼',
                'meal': '🍱 用餐',
                'sleep': '😴 睡眠'
            };
            return icons[type] || type;
        }
        
        function getRepeatTypeText(type) {
            const texts = {
                'once': '一次',
                'daily': '每天',
                'weekly': '每周',
                'custom': '自定义'
            };
            return texts[type] || type;
        }
        
        function showAddCareReminderForm() {
            const body = document.getElementById('careReminderPanelBody');
            body.innerHTML = `
                <div style="background: #171717; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
                    <h3 style="font-size: 14px; margin-bottom: 12px; color: #e5e5e5;">添加关怀提醒</h3>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">关怀类型</label>
                        <select id="careType" class="form-input">
                            <option value="water">💧 喝水提醒</option>
                            <option value="rest">😌 休息提醒</option>
                            <option value="exercise">🏃 运动提醒</option>
                            <option value="eye">👁️ 护眼提醒</option>
                            <option value="meal">🍱 用餐提醒</option>
                            <option value="sleep">😴 睡眠提醒</option>
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">提醒时间</label>
                        <input type="time" id="careTime" class="form-input" value="10:00">
                    </div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">重复方式</label>
                        <select id="careRepeatType" class="form-input">
                            <option value="daily">每天</option>
                            <option value="weekly">每周</option>
                            <option value="once">仅一次</option>
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 12px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">提醒角色（可选）</label>
                        <input type="text" id="careCharacter" class="form-input" placeholder="输入角色名称">
                    </div>
                    
                    <div style="margin-bottom: 16px;">
                        <label style="font-size: 12px; color: #a3a3a3; display: block; margin-bottom: 4px;">自定义消息（可选）</label>
                        <textarea id="careMessage" class="form-input" rows="3" placeholder="留空则使用默认消息"></textarea>
                    </div>
                    
                    <div style="display: flex; gap: 8px;">
                        <button onclick="saveCareReminder()" class="form-btn" style="flex: 1;">保存</button>
                        <button onclick="renderCareReminderSettings()" class="form-btn" style="flex: 1; background: #6b7280;">取消</button>
                    </div>
                </div>
            `;
        }
        
        async function saveCareReminder() {
            const type = document.getElementById('careType').value;
            const time = document.getElementById('careTime').value;
            const repeatType = document.getElementById('careRepeatType').value;
            const character = document.getElementById('careCharacter').value;
            const message = document.getElementById('careMessage').value;
            
            try {
                const response = await fetch(`${API_BASE}/api/proactive/care-reminders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        care_type: type,
                        reminder_time: time,
                        repeat_type: repeatType,
                        character_name: character || null,
                        custom_message: message || null
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('✅ 关怀提醒已添加', 'success');
                    renderCareReminderSettings();
                } else {
                    showToast(' ' + data.message, 'error');
                }
            } catch (error) {
                showToast('保存失败: ' + error.message, 'error');
            }
        }
        
        async function toggleCareReminder(id, enabled) {
            try {
                const response = await fetch(`${API_BASE}/api/proactive/care-reminders/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_enabled: enabled })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(enabled ? '已启用' : '已禁用', 'success');
                    renderCareReminderSettings();
                }
            } catch (error) {
                showToast('操作失败: ' + error.message, 'error');
            }
        }
        
        async function deleteCareReminder(id) {
            if (!confirm('确定要删除这个关怀提醒吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/proactive/care-reminders/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('已删除', 'success');
                    renderCareReminderSettings();
                }
            } catch (error) {
                showToast('删除失败: ' + error.message, 'error');
            }
        }
        
    </script>
</body>
</html>
