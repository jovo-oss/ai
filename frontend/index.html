<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天系统 - 智能对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text-primary: #e5e5e5;
            --text-secondary: #999999;
            --text-muted: #555555;
            --accent-color: #ffffff;
            --accent-soft: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition-fast: 0.2s ease-out;
            --transition-normal: 0.3s ease-out;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: var(--text-primary);
        }
        
        .chat-container {
            width: 100%;
            max-width: 1200px;
            height: 92vh;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: row;
            overflow: hidden;
            animation: fadeInUp 0.4s ease-out;
            position: relative;
            will-change: transform;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .channel-sidebar {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .channel-sidebar-header {
            padding: 20px 16px 12px;
        }
        
        .channel-sidebar-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        
        .channel-list::-webkit-scrollbar {
            width: 3px;
        }
        
        .channel-list::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .channel-list::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }
        
        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-bottom: 2px;
        }
        
        .channel-item:hover {
            background: var(--accent-soft);
        }
        
        .channel-item.active {
            background: var(--accent-soft);
        }
        
        .channel-avatar {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background: var(--bg-tertiary);
            flex-shrink: 0;
            transition: transform var(--transition-fast);
        }
        
        .channel-item:hover .channel-avatar {
            transform: scale(1.05);
        }
        
        .channel-item.active .channel-avatar {
            background: var(--accent-color);
        }
        
        .channel-info {
            flex: 1;
            min-width: 0;
        }
        
        .channel-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .channel-desc {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        
        .channel-add-btn {
            margin: 8px 12px 12px;
            padding: 10px;
            background: transparent;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            transition: all var(--transition-fast);
        }
        
        .channel-add-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            color: #cccccc;
        }
        
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-secondary);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }
        
        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        
        @keyframes toastSlideOut {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(40px) scale(0.95);
            }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes scaleOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.9);
            }
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 5px rgba(59, 130, 246, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            }
        }
        
        @keyframes ripple {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        .chat-header {
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        
        .header-left {
            flex-shrink: 0;
            min-width: 0;
            max-width: 320px;
        }
        
        .header-left h1 {
            font-size: 20px;
            margin-bottom: 3px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .header-left p {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .header-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .more-menu-container {
            position: relative;
        }
        
        .more-menu-btn {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all var(--transition-fast);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .more-menu-btn:hover {
            background: #333333;
            color: #ffffff;
        }
        
        .more-menu-btn .arrow {
            font-size: 10px;
            transition: transform 0.2s;
        }
        
        .more-menu-btn.active .arrow {
            transform: rotate(180deg);
        }
        
        .more-menu-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 8px;
            min-width: 180px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scale(0.95);
            transition: all var(--transition-normal);
            z-index: 100;
        }
        
        .more-menu-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        
        .more-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            color: var(--text-secondary);
            font-size: 13px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        
        .more-menu-item:hover {
            background: var(--accent-soft);
            color: var(--text-primary);
        }
        
        .more-menu-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        
        .more-menu-divider {
            height: 1px;
            background: var(--border-color);
            margin: 6px 0;
        }
        
        .header-buttons select {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            transition: all var(--transition-fast);
        }
        
        .header-buttons select option {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 8px;
        }
        
        .header-buttons select:hover {
            border-color: #404040;
        }
        
        .header-buttons select:focus {
            outline: none;
            border-color: #525252;
        }
        
        .open-panel-btn {
            background: #171717;
            border: 1px solid #262626;
            color: #a3a3a3;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .open-panel-btn:hover {
            background: #262626;
            color: #e5e5e5;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--bg-secondary);
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            animation: messageFadeIn 0.3s ease-out;
        }
        
        @keyframes messageFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.ai {
            justify-content: flex-start;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: var(--bg-tertiary);
            transition: transform var(--transition-fast);
        }
        
        .avatar:hover {
            transform: scale(1.05);
        }
        
        .message.ai .avatar {
            margin-right: 10px;
        }
        
        .message.user .avatar {
            margin-left: 10px;
            order: 2;
        }
        
        .message-bubble {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            position: relative;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.6;
            max-width: 100%;
            white-space: normal;
        }
        
        .message.user .message-bubble {
            background: #2a2a2a;
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm);
        }
        
        .message.ai .message-bubble {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: none;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }
        
        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            display: none;
        }
        
        .message-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 70%;
        }
        
        .message.user .message-wrapper {
            align-items: flex-end;
        }
        
        .message-actions-bar {
            display: none;
            gap: 8px;
            margin-top: 6px;
        }
        
        .message:hover .message-actions-bar {
            display: flex;
        }
        
        .msg-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 12px;
            border: 1px solid #262626;
            border-radius: 6px;
            background: #171717;
            color: #a3a3a3;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .msg-action-btn:hover {
            background: #262626;
            color: #e5e5e5;
        }
        
        .msg-action-btn svg {
            width: 14px;
            height: 14px;
        }
        
        .msg-action-btn.undo-btn {
            background: #4a1942;
            border-color: #6b2158;
            color: #f0abfc;
        }
        
        .msg-action-btn.undo-btn:hover {
            background: #6b2158;
            color: #f5d0fe;
        }
        
        .play-audio-btn {
            background: #171717;
            border: 1px solid #262626;
            color: #a3a3a3;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .play-audio-btn:hover {
            background: #262626;
            color: #e5e5e5;
        }
        
        .regenerate-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .regenerate-modal.show {
            opacity: 1;
        }
        
        .regenerate-modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .regenerate-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #333;
        }
        
        .regenerate-modal-header h3 {
            margin: 0;
            color: #e5e5e5;
            font-size: 16px;
        }
        
        .regenerate-modal-close {
            background: none;
            border: none;
            color: #737373;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .regenerate-modal-close:hover {
            background: #262626;
            color: #e5e5e5;
        }
        
        .regenerate-modal-body {
            padding: 20px;
        }
        
        .regenerate-tip {
            color: #f59e0b;
            font-size: 14px;
            margin: 0 0 12px 0;
            font-weight: 600;
        }
        
        .regenerate-tips {
            color: #a3a3a3;
            font-size: 13px;
            margin: 0 0 16px 0;
            padding-left: 20px;
        }
        
        .regenerate-tips li {
            margin-bottom: 6px;
        }
        
        .regenerate-input-group {
            margin-top: 16px;
        }
        
        .regenerate-input-group label {
            display: block;
            color: #a3a3a3;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .regenerate-input-group textarea {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e5e5e5;
            font-size: 13px;
            resize: vertical;
            font-family: inherit;
        }
        
        .regenerate-input-group textarea:focus {
            outline: none;
            border-color: #f59e0b;
        }
        
        .regenerate-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .preset-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #a3a3a3;
            transition: all 0.2s;
            user-select: none;
        }
        
        .preset-checkbox:hover {
            border-color: #f59e0b;
            background: #1a1a0d;
        }
        
        .preset-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #f59e0b;
            cursor: pointer;
        }
        
        .preset-checkbox input[type="checkbox"]:checked + span,
        .preset-checkbox:has(input:checked) {
            border-color: #f59e0b;
            background: #1a1a0d;
            color: #f59e0b;
        }
        
        .char-count {
            text-align: right;
            font-size: 11px;
            color: #737373;
            margin-top: 4px;
        }
        
        .regenerate-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid #333;
        }
        
        .regenerate-btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .regenerate-btn.cancel {
            background: #262626;
            color: #a3a3a3;
        }
        
        .regenerate-btn.cancel:hover {
            background: #333;
            color: #e5e5e5;
        }
        
        .regenerate-btn.confirm {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        
        .regenerate-btn.confirm:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
        }
        
        .chat-input-container {
            padding: 16px 24px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .restart-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-sm);
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        
        .restart-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
        }
        
        .restart-btn svg {
            width: 16px;
            height: 16px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            outline: none;
            transition: all var(--transition-fast);
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .chat-input:focus {
            border-color: var(--accent-color);
            background: var(--bg-secondary);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        
        .chat-input::placeholder {
            color: var(--text-muted);
        }
        
        .send-btn {
            padding: 12px 24px;
            background: #333333;
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }
        
        .send-btn:hover {
            background: #444444;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        
        .send-btn:active {
            transform: scale(0.98);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: var(--radius-md);
            margin-bottom: 16px;

        function updateModelSelector(models, currentId) {

                const option = document.createElement('option');

                option.disabled = true;

        // 搜索过滤模型

            const cards = document.querySelectorAll('.model-card');
            const text = searchText.toLowerCase();
            let visibleCount = 0;
            
            cards.forEach(card => {
                const name = card.dataset.name;
                const provider = card.dataset.provider;
                
                if (name.includes(text) || provider.includes(text)) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            // 显示或隐藏空状态提示
            let emptyState = document.getElementById('searchEmptyState');
            if (visibleCount === 0 && searchText) {
                if (!emptyState) {
                    const grid = document.getElementById('modelGrid');
                    emptyState = document.createElement('div');
                    emptyState.id = 'searchEmptyState';
                    emptyState.className = 'empty-state';
                    emptyState.innerHTML = `

                    grid.parentNode.insertBefore(emptyState, grid.nextSibling);

        async function addDiscoveredModel(provider, modelId) {
            const providerConfigs = {
                "DeepSeek": {
                    "base_url": "https://api.deepseek.com",
                    "api_key_env": "DEEPSEEK_API_KEY"
                },
                "OpenAI": {
                    "base_url": "https://api.openai.com/v1",
                    "api_key_env": "OPENAI_API_KEY"
                },
                "阿里云": {
                    "base_url": "https://dashscope.aliyuncs.com/compatible-mode/v1",
                    "api_key_env": "DASHSCOPE_API_KEY"
                },
                "智谱AI": {
                    "base_url": "https://open.bigmodel.cn/api/paas/v4",
                    "api_key_env": "ZHIPU_API_KEY"
                },
                "百度": {
                    "base_url": "https://qianfan.baidubce.com/v2",
                    "api_key_env": "BAIDU_API_KEY"
                }
            };
            
            const config = providerConfigs[provider] || {
                "base_url": "https://api.openai.com/v1",
                "api_key_env": "CUSTOM_API_KEY"
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/models/add-custom`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: modelId,
                        name: modelId,
                        provider: provider,

        async function saveApiKey(provider, envName) {
            const input = document.getElementById(`api-key-${provider}`);
            const apiKey = input.value.trim();
            
            if (!apiKey) {
                addMessage('ai', `❌ 请输入 ${provider} 的 API Key`);
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/models/api-keys`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: provider,
                        env_name: envName,
                        api_key: apiKey
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addMessage('ai', `✅ ${provider} API Key 已保存，正在拉取可用模型...`);
                    // 重新加载模型列表
                    await loadModels();
                    renderModelPanel();
                    
                    // 自动拉取该供应商的模型
                    await discoverModelsFromProvider(provider);
                    
                    // 提示用户打开模型广场
                    setTimeout(() => {
                        addMessage('ai', `🎯 ${provider} 模型已拉取完成！请点击顶部"模型广场"按钮查看和选择模型`);
                    }, 1000);
                } else {
                    addMessage('ai', `❌ 保存失败: ${data.message}`);
                }
            } catch (error) {
                console.error('保存API Key失败:', error);
                addMessage('ai', '❌ 保存失败，请检查网络连接');
            }
        }

        async function checkModelVisionSupport() {
            try {
                // 获取当前活跃配置
                const response = await fetch(`${API_BASE}/api/configs/active?user_id=${USER_ID}`);
                const data = await response.json();
                
                if (!data.success || !data.config) {
                    return false;
                }
                
                const config = data.config;
                
                // 检查是否配置了视觉模型
                if (config.vision_model && config.vision_model.trim() !== '') {
                    return true;
                }
                
                // 检查聊天模型是否支持视觉（一些模型的聊天模型本身就支持视觉）
                const chatModel = config.chat_model || '';
                const visionSupportedModels = [
                    'gpt-4-vision', 'gpt-4o', 'gpt-4-turbo',
                    'claude-3', 'gemini', 'qwen-vl',
                    'deepseek-vl', 'deepseek-v3',
                    'vision', 'vl'
                ];
                
                for (const model of visionSupportedModels) {
                    if (chatModel.toLowerCase().includes(model.toLowerCase())) {
                        return true;
                    }
                }
                
                return false;
            } catch (error) {
                console.error('检查视觉支持失败:', error);
                return false;
            }
        }
        
        async function handleImageSelect(event) {

                showToast('图片大小不能超过10MB', 'error');
                return;
            }
            
            // 读取图片为base64
            const reader = new FileReader();
            reader.onload = async function(e) {
                const imageBase64 = e.target.result;
                
                // 显示图片预览
                addMessage('user', `<img src="${imageBase64}" style="max-width: 300px; max-height: 300px; border-radius: 8px; cursor: pointer;" onclick="window.open('${imageBase64}')">`);
                
                // 显示输入指示器

                try {

                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            user_id: USER_ID,
                            image_base64: imageBase64,
                            enable_tts: true
                        })
                    });
                    
                    const data = await response.json();
                    
                    // 隐藏输入指示器
                    hideTypingIndicator();
                    
                    if (data.success) {
                        // 添加AI回复到界面
                        addMessage('ai', data.reply, data.audio_base64);
                    } else {
                        addMessage('ai', '抱歉，图片分析失败：' + (data.message || '未知错误'));
                    }
                } catch (error) {
                    hideTypingIndicator();
                    addMessage('ai', '抱歉，无法连接到服务器。');
                    console.error('Error:', error);
                }
            };
            reader.readAsDataURL(file);
            
            // 清空input，允许重复选择同一文件
            event.target.value = '';

            const escapedContent = content.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');

                    <button class="msg-action-btn" onclick="backtrackMessage(this)">

        function playAudio(base64Audio) {
            audioPlayer.src = `data:audio/mp3;base64,${base64Audio}`;
            audioPlayer.play();
        }
        
        function copyMessage(btn, content) {
            navigator.clipboard.writeText(content).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已复制`;
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = content;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 已复制`;
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 2000);
            });
        }
        
        async function backtrackMessage(btn) {
            const messageDiv = btn.closest('.message');
            // 移除所有 msg- 前缀，只保留纯数字 ID
            const msgId = messageDiv.id.replace(/^msg-/g, '');
            
            if (!confirm('确定要回溯到这条消息吗？这将删除此消息之后的所有聊天记录。')) {
                return;
            }
            
            // 验证 ID 是否为有效数字
            const messageId = parseInt(msgId);
            if (isNaN(messageId)) {
                showToast('消息 ID 无效，请重启角色后重试', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/chat/delete-messages-after`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        message_id: messageId
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    let errorMsg = '服务器错误';
                    if (data.detail) {
                        if (typeof data.detail === 'string') {
                            errorMsg = data.detail;
                        } else if (Array.isArray(data.detail)) {
                            errorMsg = data.detail.map(d => d.msg || d.message || JSON.stringify(d)).join(', ');
                        } else {
                            errorMsg = JSON.stringify(data.detail);
                        }
                    } else if (data.message) {
                        errorMsg = data.message;
                    }
                    showToast(`回溯失败: ${errorMsg}`, 'error');
                    return;
                }
                
                if (data.success) {
                    showToast(`已回溯，删除了 ${data.deleted_count} 条消息`, 'success');
                    
                    const messages = chatHistories[currentCharacterId] || [];
                    const targetIndex = messages.findIndex(m => {
                        const mId = String(m.id).replace(/^msg-/g, '');
                        return mId == msgId;
                    });
                    
                    if (targetIndex !== -1) {
                        messages.splice(targetIndex);
                        saveChatForCharacter(currentCharacterId);
                    }
                    
                    renderChatMessages(currentCharacterId);
                    refreshContext();
                } else {
                    showToast(`回溯失败: ${data.message}`, 'error');
                }
            } catch (error) {
                console.error('回溯失败:', error);
                showToast('回溯失败，请检查网络连接', 'error');
            }
        }
        
        async function continueMessage(btn) {

            const lastAiContent = messageBubble.childNodes[0]?.textContent?.trim() || '';

                return;

            showTypingIndicator();
            
            try {
                const continuePrompt = `请继续你刚才的回复，接着这段内容继续说：${lastAiContent.substring(0, 200)}`;
                
                const response = await fetch(`${API_BASE}/api/chat/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        message: continuePrompt,
                        enable_tts: false
                    })
                });
                
                const data = await response.json();
                hideTypingIndicator();
                
                if (data.success) {
                    const time = new Date().toLocaleTimeString('zh-CN', {

                hideTypingIndicator();
                console.error('Continue error:', error);

            }

        async function confirmRegenerate() {
            const customPrompt = document.getElementById('regeneratePrompt').value.trim();
            
            const presetCheckboxes = document.querySelectorAll('input[name="regeneratePreset"]:checked');
            const presetValues = Array.from(presetCheckboxes).map(cb => cb.value);
            
            let combinedPrompt = '';
            if (presetValues.length > 0) {
                combinedPrompt = presetValues.join('，');
            }
            if (customPrompt) {
                if (combinedPrompt) {
                    combinedPrompt += `，${customPrompt}`;
                } else {
                    combinedPrompt = customPrompt;
                }
            }
            
            if (combinedPrompt.length > 200) {
                showToast('提示词过长，请精简后再试', 'error');
                return;
            }
            
            closeRegenerateModal();
            
            const messages = document.querySelectorAll('.message');
            let targetMessage = null;
            for (let i = messages.length - 1; i >= 0; i--) {
                if (messages[i].classList.contains('ai')) {
                    targetMessage = messages[i];
                    break;
                }
            }
            
            if (!targetMessage) {
                showToast('没有找到AI回复', 'error');
                return;
            }
            
            const targetMsgId = targetMessage.id.replace('msg-', '');
            const prevMessage = targetMessage.previousElementSibling;
            const prevMsgId = prevMessage ? prevMessage.id.replace('msg-', '') : null;
            
            try {
                // 删除数据库中的旧消息
                const deleteTargetId = prevMsgId ? parseInt(prevMsgId) : parseInt(targetMsgId);
                
                if (deleteTargetId && !isNaN(deleteTargetId)) {
                    const deleteResponse = await fetch(`${API_BASE}/api/chat/delete-messages-after`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: USER_ID,
                            message_id: deleteTargetId
                        })
                    });
                    
                    const deleteData = await deleteResponse.json();
                    if (!deleteData.success) {
                        console.warn('删除消息失败，但继续重新生成:', deleteData.message);
                    }
                }
                
                // 从本地历史中移除旧消息
                const chatMessages = chatHistories[currentCharacterId] || [];
                if (chatMessages.length > 0) {
                    chatMessages.pop();
                    if (chatMessages.length > 0 && prevMessage) {
                        chatMessages.pop();
                    }
                    saveChatForCharacter(currentCharacterId);
                }
                
                // 从DOM中移除旧消息
                targetMessage.remove();
                if (prevMessage) {
                    prevMessage.remove();
                }
                
                renderChatMessages(currentCharacterId);
                
                showTypingIndicator();
                
                const lastUserMessage = chatMessages.length > 0 ? chatMessages[chatMessages.length - 1].content : '请重新回答上一条问题';
                const userMessage = combinedPrompt ? `请重新回答上一条问题，注意：${combinedPrompt}` : lastUserMessage;
                
                const response = await fetch(`${API_BASE}/api/chat/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        message: userMessage,
                        enable_tts: true
                    })
                });
                
                const data = await response.json();
                hideTypingIndicator();
                
                if (data.success) {
                    const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    const aiDbId = data.metadata?.ai_msg_id;
                    const aiMsgId = aiDbId || (Date.now() + 1);
                    
                    // 添加新消息，并标记为可撤回
                    addMessageToContainer('ai', data.reply, time, aiMsgId, true, true);
                } else {
                    showToast('重新生成失败', 'error');
                }
            } catch (error) {
                hideTypingIndicator();
                console.error('Regenerate error:', error);
                showToast('重新生成失败，请检查网络连接', 'error');
            }
        }
        
        // 撤回重说：恢复原始消息
        function undoRegenerate() {
            if (!lastRegeneratedMessages) {
                showToast('没有可撤回的重说', 'error');
                return;
            }
            
            const { aiMsgId, aiContent, userMsgId, userContent } = lastRegeneratedMessages;
            
            // 从本地历史中移除重说后的AI消息
            const chatMessages = chatHistories[currentCharacterId] || [];
            if (chatMessages.length > 0) {
                chatMessages.pop();
            }
            
            // 重新添加原始的用户消息
            if (userContent && userMsgId) {
                const userTime = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                chatMessages.push({ role: 'user', content: userContent, time: userTime, id: userMsgId });
            }
            
            // 重新添加原始的AI消息
            if (aiContent && aiMsgId) {
                const aiTime = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                chatMessages.push({ role: 'ai', content: aiContent, time: aiTime, id: aiMsgId });
            }
            
            saveChatForCharacter(currentCharacterId);
            
            // 重新渲染整个聊天界面
            renderChatMessages(currentCharacterId);
            
            // 清空存储
            lastRegeneratedMessages = null;
            
            showToast('已撤回重说，恢复原始消息', 'success');
        }

        // 重启角色：清空聊天记录、足迹和记忆
        async function restartCharacter() {
            if (!currentCharacterId) {
                showToast('请先选择一个角色', 'error');
                return;
            }
            
            const char = allCharacters.find(c => c.id === currentCharacterId);
            const charName = char ? char.name : '当前角色';
            
            if (!confirm(`确定要重启"${charName}"吗？\n\n这将清空：\n- 所有聊天记录\n- 所有足迹信息\n- 所有角色记忆\n- 上下文缓存\n\n恢复角色初始状态。此操作不可撤销！`)) {
                return;
            }
            
            try {
                showToast('正在重启角色...', 'info');
                
                // 1. 清空本地聊天记录
                chatHistories[currentCharacterId] = [];
                saveChatForCharacter(currentCharacterId);
                
                // 2. 清空撤销记录缓存
                lastDeletedMessage = null;
                localStorage.removeItem('lastDeletedMessage');
                
                // 3. 清空上下文显示区块的缓存
                window.currentContext = null;
                
                // 4. 清空后端数据库中的聊天记录
                const clearResponse = await fetch(`${API_BASE}/api/chat/clear-history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: USER_ID,
                        character_id: currentCharacterId
                    })
                });
                
                const clearData = await clearResponse.json();
                if (clearData.success) {
                    console.log(`[重启] 已清空后端聊天记录，删除了 ${clearData.deleted_count} 条消息`);
                } else {
                    console.warn('[重启] 清空后端聊天记录失败:', clearData.message);
                }
                
                // 5. 清空后端足迹
                const footprintResponse = await fetch(`${API_BASE}/api/memory-events/clear/${currentCharacterId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: USER_ID })
                });
                
                const footprintData = await footprintResponse.json();
                if (footprintData.success) {
                    console.log('[重启] 已清空足迹数据');
                } else {
                    console.warn('[重启] 清空足迹失败:', footprintData.message);
                }
                
                // 6. 清空后端记忆（新增！）
                const memoryResponse = await fetch(`${API_BASE}/api/memories/clear`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: USER_ID,
                        character_id: currentCharacterId
                    })
                });
                
                const memoryData = await memoryResponse.json();
                if (memoryData.success) {
                    console.log(`[重启] 已清空记忆数据，删除了 ${memoryData.deleted_count} 条记录`);
                } else {
                    console.warn('[重启] 清空记忆失败:', memoryData.message);
                }
                
                // 7. 重新渲染聊天界面（显示初始问候语）
                renderChatMessages(currentCharacterId);
                
                // 8. 刷新上下文（强制重新加载，不使用缓存）
                await loadContextForCharacter(currentCharacterId);
                
                // 9. 如果记忆面板打开，刷新它
                if (document.getElementById('memoryPanel') && document.getElementById('memoryPanel').classList.contains('show')) {
                    loadMemoryView();
                }
                
                // 10. 如果足迹面板打开，刷新它
                if (document.getElementById('footprintPanel') && document.getElementById('footprintPanel').classList.contains('show')) {
                    loadFootprintView();
                }
                
                showToast(`"${charName}"已重启完成！`, 'success');
                console.log('[重启] 角色重启完成，所有数据已清理');
                
            } catch (error) {
                console.error('[重启] 重启角色失败:', error);
                showToast('重启失败，请检查网络连接', 'error');
            }
        }

        function handleChatFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const statusEl = document.getElementById('chatFileStatus');
            statusEl.textContent = `📄 已选择文件: ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                let parsedContent = '';
                
                if (file.name.endsWith('.json')) {
                    try {
                        const data = JSON.parse(content);
                        if (Array.isArray(data)) {
                            parsedContent = data.map(msg => {
                                const role = msg.role === 'user' ? '用户' : 'AI';
                                return `${role}：${msg.content}`;
                            }).join('\n');
                        } else if (data.messages && Array.isArray(data.messages)) {
                            parsedContent = data.messages.map(msg => {
                                const role = msg.role === 'user' ? '用户' : 'AI';
                                return `${role}：${msg.content}`;
                            }).join('\n');
                        } else {
                            parsedContent = content;
                        }
                    } catch (e) {
                        parsedContent = content;
                    }
                } else if (file.name.endsWith('.csv')) {
                    const lines = content.split('\n');
                    parsedContent = lines.slice(1).map(line => {
                        const parts = line.split(',');
                        if (parts.length >= 2) {
                            const role = parts[0].trim() === 'user' ? '用户' : 'AI';
                            return `${role}：${parts.slice(1).join(',').trim()}`;
                        }
                        return line;
                    }).join('\n');
                } else {
                    parsedContent = content;
                }
                
                const textarea = document.getElementById('chatContentInput');
                if (textarea) {
                    textarea.value = parsedContent;
                }
            };
            reader.readAsText(file);
        }

        function generateCharacterId(name) {
            if (!name) return 'character_' + Date.now();
            return name.toLowerCase()
                .replace(/[^a-z0-9\u4e00-\u9fa5]/g, '_')
                .replace(/_{2,}/g, '_')
                .substring(0, 30) || 'character_' + Date.now();
        }
        
        async function parsePngCharacterCard(file) {
            // 尝试从PNG文件中提取嵌入的JSON数据
            // 支持常见的角色卡格式（如TavernAI、SillyTavern等）
            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);
            
            // 查找PNG中的tEXt块（文本数据块）
            let offset = 8; // 跳过PNG签名
            while (offset < uint8Array.length - 12) {
                const length = (uint8Array[offset] << 24) | (uint8Array[offset + 1] << 16) | (uint8Array[offset + 2] << 8) | uint8Array[offset + 3];
                const chunkType = String.fromCharCode(...uint8Array.slice(offset + 4, offset + 8));
                
                if (chunkType === 'tEXt' || chunkType === 'iTXt' || chunkType === 'zTXt') {
                    const textData = new TextDecoder().decode(uint8Array.slice(offset + 8, offset + 8 + length));
                    
                    // 尝试解析JSON
                    try {
                        // TavernAI格式：chara字段是Base64编码的JSON
                        if (textData.startsWith('chara')) {
                            const base64Data = textData.substring(5);
                            const jsonStr = atob(base64Data);
                            return JSON.parse(jsonStr);
                        }
                        
                        // 直接JSON
                        if (textData.trim().startsWith('{')) {
                            return JSON.parse(textData);
                        }
                    } catch (e) {
                        // 继续查找下一个文本块
                    }
                }
                
                offset += 12 + length; // 4字节长度 + 4字节类型 + 数据 + 4字节CRC
            }
            
            throw new Error('PNG文件中未找到角色卡数据');
        }

            const system_prompt = document.getElementById('charFormSystemPrompt').value.trim();
            const tagsStr = document.getElementById('charFormTags').value.trim();
            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];
            
            // 验证必填字段
            if (!id) {
                alert('请填写角色ID（只能使用英文和数字）');
                return;
            }
            
            if (!/^[a-zA-Z0-9_]+$/.test(id)) {

            try {
                const response = await fetch(`${API_BASE}/api/characters/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, name, description, personality, greeting, system_prompt, avatar, tags })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('角色创建成功', 'success');
                    hideCharacterForm();
                    await loadCharacters();
                    renderCharacterPanel();
                    switchCharacter(id);
                } else {
                    showToast(`创建失败: ${data.message}`, 'error');

                console.error('创建角色失败:', error);
                showToast('创建失败，请检查网络连接', 'error');

        }

                if (data.success) {

        function renderWorldbookPanel() {

            // 按集合分组

            allWorldbookEntries.forEach(entry => {
                if (entry.collection) {
                    if (!collections[entry.collection]) {
                        collections[entry.collection] = { name: getCollectionName(entry.collection), entries: [] };
                    }
                    collections[entry.collection].entries.push(entry);
                } else {
                    standalone.push(entry);
                }
            });
            
            let html = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">

                </div>

            // 渲染集合

                        <div class="worldbook-collection-header" onclick="toggleCollection('${collectionId}')" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 8px; cursor: pointer; border: 1px solid #262626;">

        function importWorldbook() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    const text = await file.text();
                    let worldbookData;
                    
                    try {
                        worldbookData = JSON.parse(text);
                    } catch (parseError) {
                        alert('JSON格式错误: ' + parseError.message);
                        return;
                    }
                    
                    // 支持单个条目或条目数组
                    const entries = Array.isArray(worldbookData) ? worldbookData : [worldbookData];
                    
                    let importedCount = 0;
                    let skippedCount = 0;
                    
                    for (const entry of entries) {
                        // 验证必要字段
                        if (!entry.title || !entry.content) {
                            skippedCount++;
                            continue;
                        }
                        
                        // 生成ID（如果没有）
                        const entryId = entry.id || 'wb_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
                        
                        const data = {
                            id: entryId,
                            title: entry.title,
                            content: entry.content,
                            category: entry.category || 'general',
                            tags: entry.tags || [],
                            is_active: entry.is_active !== undefined ? entry.is_active : true
                        };
                        
                        try {
                            const response = await fetch(`${API_BASE}/api/worldbook/create`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(data)
                            });
                            
                            const result = await response.json();
                            if (result.success) {
                                importedCount++;
                            } else {
                                skippedCount++;
                            }
                        } catch (err) {
                            skippedCount++;
                        }
                    }
                    
                    await loadWorldbook();
                    renderWorldbookPanel();
                    
                    let msg = `✅ 导入完成！成功导入 ${importedCount} 个条目`;
                    if (skippedCount > 0) {
                        msg += `，跳过 ${skippedCount} 个无效条目`;
                    }
                    alert(msg);
                    
                } catch (error) {
                    console.error('导入世界书失败:', error);
                    alert('❌ 导入失败: ' + error.message);
                }
            };
            input.click();
        }

        function loadChatForCharacter(characterId) {
            const saved = localStorage.getItem(`chat_${characterId}`);
            chatHistories[characterId] = saved ? JSON.parse(saved) : [];
            renderChatMessages(characterId);
            loadContextForCharacter(characterId);

        async function loadContextForCharacter(characterId) {
            const contextContent = document.getElementById('contextContent');
            const contextSubtitle = document.getElementById('contextSubtitle');
            
            const char = allCharacters.find(c => c.id === characterId);
            if (!char) {
                contextContent.innerHTML = '<div class="context-empty">未选择角色</div>';
                contextSubtitle.textContent = '';
                return;
            }
            
            contextSubtitle.textContent = `${char.avatar} ${char.name}`;
            contextContent.innerHTML = '<div class="context-loading"><div class="context-loading-spinner"></div><div>正在加载上下文...</div></div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/chat/context?character_id=${characterId}`);
                const data = await response.json();
                
                if (data.success) {
                    renderContext(data.context);
                } else {
                    renderContextEmpty();
                }
            } catch (error) {
                console.error('加载上下文失败:', error);
                renderContextEmpty();
            }
        }
        
        function renderContext(context) {
            const contextContent = document.getElementById('contextContent');
            
            // 保存当前上下文到window对象，供删除功能使用
            window.currentContext = context;
            
            if (!context || Object.keys(context).length === 0) {
                renderContextEmpty();
                return;
            }
            
            let html = '';
            
            html += `
                <div class="context-search">
                    <input type="text" class="context-search-input" placeholder="🔍 搜索上下文..." oninput="searchContext(this.value)">
                </div>
            `;
            
            const msgCount = context.recent_messages ? context.recent_messages.length : 0;
            const worldbookCount = context.worldbook_entries ? context.worldbook_entries.length : 0;
            const memoryCount = context.memories ? context.memories.length : 0;
            const footprintCount = context.footprint && context.footprint.locations ? context.footprint.locations.length : 0;
            
            html += `
                <div class="context-stats">
                    <div class="context-stat-item">
                        <div class="context-stat-value">${msgCount}</div>
                        <div class="context-stat-label">对话</div>
                    </div>
                    <div class="context-stat-item">
                        <div class="context-stat-value">${worldbookCount}</div>
                        <div class="context-stat-label">世界书</div>
                    </div>
                    <div class="context-stat-item">
                        <div class="context-stat-value">${memoryCount}</div>
                        <div class="context-stat-label">记忆</div>
                    </div>
                    <div class="context-stat-item">
                        <div class="context-stat-value">${footprintCount}</div>
                        <div class="context-stat-label">足迹</div>
                    </div>
                </div>

                    <button class="context-action-btn" onclick="showAuthorNoteConfig()" title="配置Author's Note">
                        ✏️ 作者注释

                        🗜️ 强制摘要

            if (context.character_info) {

                    <div class="context-section" data-section="character">

                            <div class="context-section-title">

                                <span>角色信息</span>
                            </div>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="context-section-body">
                            <div class="context-item">
                                <div class="context-item-title">${context.character_info.name || '未命名'}</div>
                                <div class="context-item-content">${context.character_info.description || '暂无描述'}</div>
                                ${context.character_info.tags ? context.character_info.tags.map(tag => `<span class="context-tag">${tag}</span>`).join('') : ''}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            if (context.recent_messages && context.recent_messages.length > 0) {
                html += `
                    <div class="context-section" data-section="messages">
                        <div class="context-section-header" onclick="toggleContextSection(this)">
                            <div class="context-section-title">
                                <span class="icon">💬</span>
                                <span>最近对话</span>
                            </div>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="context-section-body">
                `;
                const displayMessages = context.recent_messages.slice(-5);
                displayMessages.forEach((msg, index) => {
                    const role = msg.role === 'user' ? '👤 你' : '🤖 AI';
                    const preview = msg.content.length > 100 ? msg.content.substring(0, 100) + '...' : msg.content;
                    html += `
                        <div class="context-item message-context-item" data-msg-id="${msg.id || ''}">
                            <div class="context-item-header">
                                <div class="context-item-title">${role}</div>
                                <button class="context-item-delete" onclick="deleteRecentMessage(${index}, ${msg.id})" title="删除">×</button>
                            </div>
                            <div class="context-item-content">${preview.replace(/\n/g, '<br>')}</div>
                        </div>

                });
                html += '</div></div>';
            }
            
            if (context.worldbook_entries && context.worldbook_entries.length > 0) {
                html += `
                    <div class="context-section" data-section="worldbook">
                        <div class="context-section-header" onclick="toggleContextSection(this)">
                            <div class="context-section-title">
                                <span class="icon">📚</span>
                                <span>世界书参考</span>
                            </div>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="context-section-body">
                `;
                context.worldbook_entries.slice(0, 3).forEach(entry => {
                    html += `
                        <div class="context-item">
                            <div class="context-item-title">${entry.title || '未命名条目'}</div>
                            <div class="context-item-content">${(entry.content || '').substring(0, 100)}${(entry.content || '').length > 100 ? '...' : ''}</div>
                            ${entry.category ? `<span class="context-tag">${entry.category}</span>` : ''}
                        </div>
                    `;
                });
                html += '</div></div>';
            }
            
            if (context.memories && context.memories.length > 0) {
                html += `
                    <div class="context-section" data-section="memories">
                        <div class="context-section-header" onclick="toggleContextSection(this)">

                        </div>

                });

            }
            
            if (context.footprint && context.footprint.locations && context.footprint.locations.length > 0) {
                html += `
                    <div class="context-section" data-section="footprint">
                        <div class="context-section-header" onclick="toggleContextSection(this)">
                            <div class="context-section-title">
                                <span class="icon">🗺️</span>
                                <span>足迹信息</span>
                            </div>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="context-section-body">
                `;
                if (context.footprint.current_location) {

                        <div class="context-item">

                            <div class="context-item-content">${context.footprint.current_location}</div>

                renderContextEmpty();

                    <button class="context-action-btn" onclick="collapseAllSections()">📕 全部收起</button>
                </div>

            contextContent.classList.add('context-fade-in');
            setTimeout(() => contextContent.classList.remove('context-fade-in'), 300);
        }
        
        function toggleContextSection(header) {
            const body = header.nextElementSibling;
            header.classList.toggle('collapsed');
            body.classList.toggle('collapsed');
        }
        
        function expandAllSections() {
            document.querySelectorAll('.context-section-header').forEach(header => {
                header.classList.remove('collapsed');
                header.nextElementSibling.classList.remove('collapsed');
            });
        }
        
        function collapseAllSections() {
            document.querySelectorAll('.context-section-header').forEach(header => {
                header.classList.add('collapsed');
                header.nextElementSibling.classList.add('collapsed');
            });
        }
        
        function searchContext(query) {
            const items = document.querySelectorAll('.context-item');
            const lowerQuery = query.toLowerCase();
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (lowerQuery === '' || text.includes(lowerQuery)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // ========== 新增功能：自动摘要状态 ==========
        async function showSummaryStatus() {
            if (!currentCharacterId) {
                showToast('请先选择一个角色', 'warning');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/chat/summary-status?user_id=${USER_ID}&character_id=${currentCharacterId}`);
                const data = await response.json();

                if (data.success) {
                    const percentage = data.percentage || 0;
                    const shouldTrigger = data.should_trigger ? '⚠️ 是' : '✅ 否';
                    
                    alert(
                        `📊 自动摘要状态\n\n` +
                        `当前消息数: ${data.current_messages || 0} 条\n` +
                        `触发阈值: ${data.threshold || 30} 条\n` +
                        `距离摘要: ${data.remaining_until_summary || 0} 条\n` +
                        `进度: ${percentage.toFixed(1)}%\n` +
                        `是否应触发: ${shouldTrigger}\n` +
                        `已有摘要: ${data.existing_summaries || 0} 个\n\n` +
                        `提示：当消息数达到${data.threshold || 30}条时，系统会自动生成摘要并删除旧消息。`
                    );
                } else {
                    showToast('查询失败: ' + (data.message || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('[摘要状态] 查询失败:', error);
                showToast('查询失败，请检查网络连接', 'error');
            }
        }

        // 强制执行自动摘要

                return;

            if (!confirm('确定要立即执行自动摘要吗？\n\n这将压缩旧聊天记录为摘要，并删除原始消息。')) {
                return;

                        character_id: currentCharacterId
                    })

        function hideAuthorNoteConfig() {
            const panel = document.getElementById('authorNotePanel');
            if (panel) {
                panel.remove();
            }
            authorNoteConfigVisible = false;
        }

        async function saveAuthorNoteConfig() {
            if (!currentCharacterId) return;

            const content = document.getElementById('anContent').value.trim();
            
            if (!content) {
                showToast('请输入注释内容', 'warning');
                return;
            }

            const config = {
                user_id: USER_ID,
                character_id: currentCharacterId,
                content: content,
                depth: parseInt(document.getElementById('anDepth').value) || 3,
                interval: parseInt(document.getElementById('anInterval').value) || 4,
                position: document.getElementById('anPosition').value,
                is_enabled: document.getElementById('anEnabled').checked
            };

            try {
                const response = await fetch(`${API_BASE}/api/chat/author-note`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                const data = await response.json();

                if (data.success) {
                    showToast('✅ Author\'s Note 配置已保存', 'success');
                    hideAuthorNoteConfig();
                } else {
                    showToast('保存失败: ' + (data.message || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('[Author\'s Note] 保存失败:', error);
                showToast('保存失败，请检查网络连接', 'error');
            }
        }

        // 删除最近对话
        async function deleteRecentMessage(index, messageId) {
            if (!confirm('确定要删除这条对话记录吗？')) return;

            if (!currentCharacterId) return;

            try {
                if (messageId) {
                    const deleteResponse = await fetch(`${API_BASE}/api/chat/delete-message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: USER_ID,
                            message_id: messageId
                        })
                    });

                    const deleteData = await deleteResponse.json();
                    if (!deleteData.success) {
                        console.warn('删除后端消息失败:', deleteData.message);
                        showToast('删除失败: ' + deleteData.message, 'error');
                        return;
                    }
                    console.log('[上下文] 已从数据库删除消息 ID:', messageId);
                }

                if (window.currentContext && window.currentContext.recent_messages) {
                    const totalLength = window.currentContext.recent_messages.length;
                    const displayCount = Math.min(5, totalLength);
                    const realIndex = totalLength - displayCount + index;

                    if (realIndex >= 0 && realIndex < totalLength) {
                        window.currentContext.recent_messages.splice(realIndex, 1);
                        renderContext(window.currentContext);
                    }
                }

                if (chatHistories[currentCharacterId]) {
                    const historyLength = chatHistories[currentCharacterId].length;
                    const displayCount = Math.min(5, historyLength);
                    const historyIndex = historyLength - displayCount + index;

                    if (historyIndex >= 0 && historyIndex < historyLength) {
                        chatHistories[currentCharacterId].splice(historyIndex, 1);
                        saveChatForCharacter(currentCharacterId);
                        renderChatMessages(currentCharacterId);
                    }
                }

                showToast('消息已删除', 'success');
            } catch (error) {
                console.error('[上下文] 删除消息失败:', error);
                showToast('删除失败，请检查网络连接', 'error');
            }
        }

            const container = document.getElementById('sidebarsContainer');
            const showBtn = document.getElementById('showSidebarsBtn');
            
            container.classList.remove('hidden');
            showBtn.classList.remove('visible');
            
            // 保存状态到localStorage
            localStorage.setItem('sidebarsHidden', 'false');

            const container = document.getElementById('sidebarsContainer');
            const showBtn = document.getElementById('showSidebarsBtn');
            
            if (isHidden) {
