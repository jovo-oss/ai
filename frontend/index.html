<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天系统 - 智能对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 95vh;
            background: #0a0a0a;
            border-radius: 20px;
            box-shadow: 0 0 0 1px #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .chat-header {
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 20px 24px;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left h1 {
            font-size: 22px;
            margin-bottom: 4px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        
        .header-left p {
            font-size: 13px;
            color: #737373;
        }
        
        .header-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .header-buttons select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #262626;
            background: #171717;
            color: #e5e5e5;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .header-buttons select option {
            background: #171717;
            color: #e5e5e5;
            padding: 8px;
        }
        
        .header-buttons select:hover {
            border-color: #404040;
        }
        
        .header-buttons select:focus {
            outline: none;
            border-color: #525252;
        }
        
        .open-panel-btn {
            background: #171717;
            border: 1px solid #262626;
            color: #a3a3a3;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .open-panel-btn:hover {
            background: #262626;
            color: #e5e5e5;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #000000;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #404040;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.ai {
            justify-content: flex-start;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: #171717;
        }
        
        .message.ai .avatar {
            margin-right: 10px;
        }
        
        .message.user .avatar {
            margin-left: 10px;
            order: 2;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            position: relative;
            word-wrap: break-word;
            line-height: 1.6;
        }
        
        .message.user .message-bubble {
            background: #ffffff;
            color: #0a0a0a;
            border-bottom-right-radius: 4px;
        }
        
        .message.ai .message-bubble {
            background: #171717;
            color: #e5e5e5;
            border: 1px solid #262626;
            border-bottom-left-radius: 4px;
        }
        
        .message-time {
            font-size: 11px;
            color: #525252;
            margin-top: 6px;
        }
        
        .play-audio-btn {
            background: #171717;
            border: 1px solid #262626;
            color: #a3a3a3;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .play-audio-btn:hover {
            background: #262626;
            color: #e5e5e5;
        }
        
        .chat-actions-bar {
            display: flex;
            gap: 6px;
            padding: 6px 16px;
            background: #0a0a0a;
            border-top: 1px solid #1a1a1a;
        }
        
        .chat-action-btn {
            padding: 4px 10px;
            font-size: 11px;
            border: 1px solid #262626;
            border-radius: 6px;
            background: #171717;
            color: #a3a3a3;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .chat-action-btn:hover {
            background: #262626;
            color: #e5e5e5;
        }
        
        .chat-input-container {
            padding: 16px 20px;
            background: #0a0a0a;
            border-top: 1px solid #1a1a1a;
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #262626;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background: #000000;
            color: #e5e5e5;
        }
        
        .chat-input:focus {
            border-color: #404040;
        }
        
        .chat-input::placeholder {
            color: #525252;
        }
        
        .send-btn {
            padding: 12px 24px;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .send-btn:hover {
            background: #e5e5e5;
        }
        
        .send-btn:active {
            transform: scale(0.98);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: #171717;
            border: 1px solid #262626;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        
        .typing-indicator.show {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #737373;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        
        .model-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 420px;
            height: 100vh;
            background: #0a0a0a;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.8);
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .model-panel.show {
            right: 0;
        }
        
        .model-panel-header {
            padding: 20px 24px;
            background: #0a0a0a;
            color: #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .model-panel-header h2 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
        }
        
        .model-panel-close {
            background: #171717;
            border: 1px solid #262626;
            color: #a3a3a3;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }
        
        .model-panel-close:hover {
            background: #262626;
            color: #e5e5e5;
        }
        
        .model-panel-body {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }
        
        .model-panel-actions {
            margin-bottom: 16px;
        }
        
        .discover-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .discover-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .model-group {
            margin-bottom: 20px;
        }
        
        .model-group-title {
            font-size: 14px;
            font-weight: 600;
            color: #737373;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .model-card {
            padding: 14px;
            border: 1px solid #262626;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            background: #171717;
        }
        
        .model-card:hover {
            border-color: #404040;
            background: #262626;
        }
        
        .model-card.active {
            border-color: #525252;
            background: #262626;
        }
        
        .model-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .model-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .model-card-name {
            font-weight: 600;
            font-size: 14px;
            color: #e5e5e5;
        }
        
        .model-card-desc {
            font-size: 12px;
            color: #737373;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .model-card-features {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .feature-tag {
            padding: 3px 8px;
            background: #0a0a0a;
            border-radius: 6px;
            font-size: 11px;
            color: #a3a3a3;
            font-weight: 500;
        }
        
        .model-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            z-index: 999;
        }
        
        .model-overlay.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #525252;
        }
        
        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 14px;
        }
        
        .api-config-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #1a1a1a;
        }
        
        .api-config-title {
            font-size: 15px;
            font-weight: 600;
            color: #e5e5e5;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .api-config-item {
            background: #171717;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }
        
        .api-config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .api-config-provider {
            font-weight: 600;
            font-size: 13px;
            color: #e5e5e5;
        }
        
        .api-config-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
        }
        
        .status-configured {
            color: #525252;
        }
        
        .status-not-configured {
            color: #737373;
        }
        
        .api-config-key {
            font-size: 11px;
            color: #737373;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
        }
        
        .api-config-input-wrapper {
            display: flex;
            gap: 6px;
        }
        
        .api-config-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #262626;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            transition: all 0.2s;
            background: #0a0a0a;
            color: #e5e5e5;
        }
        
        .api-config-input:focus {
            border-color: #525252;
        }
        
        .api-config-save-btn {
            padding: 8px 16px;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .api-config-save-btn:hover {
            background: #e5e5e5;
        }
        
        .api-config-save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .character-card {
            background: #171717;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #262626;
        }
        
        .character-card:hover {
            transform: translateY(-2px);
            border-color: #404040;
        }
        
        .character-card.active {
            border-color: #525252;
            background: #262626;
        }
        
        .character-avatar {
            font-size: 44px;
            margin-bottom: 6px;
        }
        
        .character-name {
            font-weight: 600;
            font-size: 13px;
            color: #e5e5e5;
            margin-bottom: 3px;
        }
        
        .character-desc {
            font-size: 11px;
            color: #737373;
            line-height: 1.3;
        }
        
        .character-actions {
            display: flex;
            gap: 5px;
            margin-top: 6px;
            justify-content: center;
        }
        
        .char-action-btn {
            padding: 3px 8px;
            font-size: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .char-action-btn.edit {
            background: #262626;
            color: #e5e5e5;
        }
        
        .char-action-btn.edit:hover {
            background: #404040;
        }
        
        .char-action-btn.delete {
            background: #262626;
            color: #a3a3a3;
        }
        
        .char-action-btn.delete:hover {
            background: #404040;
            color: #e5e5e5;
        }
        
        .create-btn {
            padding: 7px 14px;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .create-btn:hover {
            background: #e5e5e5;
        }
        
        .ai-assist-section {
            background: #171717;
            border: 1px solid #262626;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }
        
        .ai-assist-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #262626;
            border-radius: 6px;
            font-size: 12px;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s;
            background: #0a0a0a;
            color: #e5e5e5;
        }
        
        .ai-assist-section textarea:focus {
            outline: none;
            border-color: #525252;
        }
        
        .character-form {
            background: #171717;
            border-radius: 10px;
            padding: 18px;
            margin-top: 16px;
        }
        
        .form-group {
            margin-bottom: 14px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            color: #a3a3a3;
            margin-bottom: 5px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #262626;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            background: #0a0a0a;
            color: #e5e5e5;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #525252;
        }
        
        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }
        
        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        
        .form-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .form-btn.primary {
            background: #ffffff;
            color: #0a0a0a;
        }
        
        .form-btn.secondary {
            background: #262626;
            color: #e5e5e5;
        }
        
        .worldbook-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .worldbook-item {
            background: #171717;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #262626;
            transition: all 0.2s;
        }
        
        .worldbook-item:hover {
            border-color: #404040;
        }
        
        .worldbook-item.inactive {
            opacity: 0.5;
        }
        
        .worldbook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .worldbook-title {
            font-weight: 600;
            font-size: 13px;
            color: #e5e5e5;
        }
        
        .worldbook-category {
            font-size: 10px;
            padding: 3px 6px;
            background: #0a0a0a;
            color: #a3a3a3;
            border-radius: 4px;
        }
        
        .worldbook-content {
            font-size: 12px;
            color: #737373;
            line-height: 1.5;
            margin-bottom: 6px;
        }
        
        .worldbook-actions {
            display: flex;
            gap: 6px;
        }
        
        .worldbook-btn {
            padding: 5px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-toggle {
            background: #262626;
            color: #e5e5e5;
        }
        
        .btn-toggle.inactive {
            background: #171717;
        }
        
        .btn-edit {
            background: #262626;
            color: #e5e5e5;
        }
        
        .btn-edit:hover {
            background: #404040;
        }
        
        .btn-delete {
            background: #262626;
            color: #a3a3a3;
        }
        
        .settings-section {
            margin-bottom: 20px;
        }
        
        .settings-title {
            font-weight: 600;
            font-size: 13px;
            color: #e5e5e5;
            margin-bottom: 10px;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .slider-container input[type="range"] {
            flex: 1;
        }
        
        .slider-value {
            font-weight: 600;
            color: #e5e5e5;
            min-width: 35px;
        }
        
        .message-actions {
            display: none;
            position: absolute;
            top: 6px;
            right: 6px;
        }
        
        .message-bubble:hover .message-actions {
            display: block;
        }
        
        .msg-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 3px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        
        .msg-action-btn:hover {
            opacity: 1;
        }
        
        .help-content h3 {
            margin-top: 0;
            color: #e5e5e5;
            border-bottom: 1px solid #262626;
            padding-bottom: 8px;
        }
        
        .help-section {
            margin-bottom: 20px;
        }
        
        .help-section h4 {
            color: #e5e5e5;
            margin-bottom: 6px;
        }
        
        .help-section p {
            color: #737373;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 6px;
        }
        
        .help-section ul {
            padding-left: 18px;
            margin: 6px 0;
        }
        
        .help-section li {
            color: #737373;
            font-size: 12px;
            line-height: 1.7;
        }
        
        .avatar-upload-section {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            padding: 12px;
            background: #0a0a0a;
            border-radius: 8px;
        }
        
        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #171717;
            display: flex;
            align-items: center;

<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <div class="header-left">
                    <h1>🤖 AI聊天助手</h1>

                </div>
                <div class="header-buttons">
                    <select id="modelSelect" onchange="switchModel(this.value)">

                    <button class="open-panel-btn" onclick="toggleCharacterPanel()">

                    </button>

        <div class="chat-messages" id="chatMessages">

        <div class="typing-indicator" id="typingIndicator">

        </div>
        
        <div class="chat-input-container">

                <button class="chat-action-btn" onclick="undoDelete()">↩️ 恢复</button>

    </div>
    
    <!-- 模型广场面板 -->
    <div class="model-overlay" id="modelOverlay" onclick="closeAllPanels()"></div>
    <div class="model-panel" id="modelPanel">
        <div class="model-panel-header">

        <div class="model-panel-body" id="modelPanelBody">
            <p style="text-align: center; color: #737373;">加载中...</p>

    <!-- 角色预设面板 -->
    <div class="model-panel" id="characterPanel">
        <div class="model-panel-header">
            <h2>👤 角色预设</h2>
            <button class="model-panel-close" onclick="closeAllPanels()">×</button>
        </div>
        <div class="model-panel-body" id="characterPanelBody">
            <p style="text-align: center; color: #737373;">加载中...</p>
        </div>
    </div>
    
    <!-- 世界书面板 -->
    <div class="model-panel" id="worldbookPanel">

        <div class="model-panel-body" id="worldbookPanelBody">
            <p style="text-align: center; color: #737373;">加载中...</p>
        </div>

    <!-- 设置面板 -->
    <div class="model-panel" id="settingsPanel">
        <div class="model-panel-header">
            <h2>⚙️ 聊天设置</h2>
            <button class="model-panel-close" onclick="closeAllPanels()">×</button>
        </div>
        <div class="model-panel-body" id="settingsPanelBody">
            <p style="text-align: center; color: #737373;">加载中...</p>
        </div>
    </div>
    
    <!-- 帮助面板 -->
    <div class="model-panel" id="helpPanel">
        <div class="model-panel-header">
            <h2>❓ 使用帮助</h2>
            <button class="model-panel-close" onclick="closeAllPanels()">×</button>
        </div>
        <div class="model-panel-body" id="helpPanelBody">
            <p style="text-align: center; color: #737373;">加载中...</p>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        const USER_ID = 1;
        let audioPlayer = new Audio();
        let allModels = [];
        let currentModelId = '';
        let allCharacters = [];
        let currentCharacterId = localStorage.getItem('currentCharacterId') || 'default';
        let allWorldbookEntries = [];
        let chatSettings = {
            temperature: 0.7,
            max_tokens: 2000,
            top_p: 0.9
        };
        
        // 页面加载时获取模型列表并聚焦输入框
        window.onload = async () => {
            document.getElementById('messageInput').focus();
            await loadModels();
            await loadCharacters();
            await loadWorldbook();
            renderModelPanel();
            renderCharacterPanel();
            renderWorldbookPanel();
            loadSettings();
            loadChatForCharacter(currentCharacterId);
        };
        
        async function loadModels() {
            try {
                console.log('开始加载模型列表...');
                const response = await fetch(`${API_BASE}/api/models/list`);
                console.log('模型列表响应状态:', response.status);
                const data = await response.json();
                console.log('模型列表数据:', data);
                
                if (data.success) {
                    allModels = data.models;
                    currentModelId = data.current_model;
                    console.log('模型加载成功，共', allModels.length, '个模型');
                    updateModelSelector(data.models, data.current_model);
                } else {
                    console.error('模型列表返回失败:', data);
                    updateModelSelector([], null);
                }
            } catch (error) {
                console.error('加载模型列表失败:', error);
                updateModelSelector([], null);
            }
        }
        
        function updateModelSelector(models, currentId) {
            const select = document.getElementById('modelSelect');
            select.innerHTML = '';
            
            const configuredModels = models.filter(m => m.api_key_configured);
            
            if (configuredModels.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.text = '⚠️ 请先在设置中配置API Key';
                option.disabled = true;
                option.selected = true;
                select.appendChild(option);
            } else {
                configuredModels.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.text = `${model.name}`;
                    option.selected = model.id === currentId;
                    select.appendChild(option);
                });
            }
        }
        
        function getProviderClass(provider) {
            const map = {
                'DeepSeek': 'badge-deepseek',
                'OpenAI': 'badge-openai',
                '阿里云': 'badge-aliyun',
                '智谱AI': 'badge-zhipu',
                '百度': 'badge-baidu'
            };
            return map[provider] || 'badge-deepseek';
        }
        
        async function switchModel(modelId) {
            if (!modelId) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/models/switch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model_id: modelId })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentModelId = modelId;
                }
            } catch (error) {
                console.error('切换模型失败:', error);
            }
        }
        
        function toggleModelPanel() {
            const panel = document.getElementById('modelPanel');
            const overlay = document.getElementById('modelOverlay');
            panel.classList.toggle('show');
            overlay.classList.toggle('show');
            
            if (panel.classList.contains('show')) {
                renderModelPanel();
            }
        }
        
        function renderModelPanel() {
            const body = document.getElementById('modelPanelBody');
            
            let html = `
                <div class="model-panel-actions">
                    <button class="discover-btn" onclick="discoverModels()">
                        🔍 从供应商拉取可用模型
                    </button>
                </div>
                <div id="discoverResult" style="display: none; margin-bottom: 16px;"></div>
            `;
            
            // 按提供商分组
            const groups = {};
            allModels.forEach(model => {
                if (!groups[model.provider]) {
                    groups[model.provider] = [];
                }
                groups[model.provider].push(model);
            });
            
            for (const [provider, models] of Object.entries(groups)) {
                html += `<div class="model-group">`;
                html += `<div class="model-group-title">${provider}</div>`;
                
                models.forEach(model => {
                    const isActive = model.id === currentModelId;
                    const isDisabled = !model.api_key_configured;
                    const providerClass = getProviderClass(provider);
                    
                    html += `
                        <div class="model-card ${isActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}" 
                             onclick="${isDisabled ? '' : `selectModelFromPanel('${model.id}')`}">
                            <div class="model-card-header">
                                <span class="model-card-name">${model.name}</span>
                                <span class="model-badge ${providerClass}">${model.api_key_configured ? '✓ 已配置' : '✗ 未配置'}</span>
                            </div>
                            <div class="model-card-desc">${model.description}</div>
                            <div class="model-card-features">
                                ${model.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }
            
            // 添加API配置区域
            html += renderApiConfigSection();
            
            body.innerHTML = html;
        }
        
        async function discoverModels() {
            const resultDiv = document.getElementById('discoverResult');
            if (!resultDiv) return;
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<p style="text-align: center; color: #737373;">正在拉取模型...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/models/discover`);
                const data = await response.json();
                
                if (!data.success) {
                    resultDiv.innerHTML = '<p style="color: #f44336;">拉取失败，请检查API Key配置</p>';
                    return;
                }
                
                let html = '<div style="background: #171717; padding: 16px; border-radius: 8px; border: 1px solid #262626;">';
                html += '<div style="font-size: 14px; font-weight: 600; color: #e5e5e5; margin-bottom: 12px;">';
                html += `✅ 发现 ${data.total} 个可用模型</div>`;
                
                for (const [provider, models] of Object.entries(data.providers)) {
                    html += `<div style="margin-bottom: 12px;">`;
                    html += `<div style="font-size: 13px; color: #a3a3a3; margin-bottom: 8px;">${provider} (${models.length}个)</div>`;
                    
                    models.forEach(model => {
                        const exists = allModels.find(m => m.id === model.id);
                        html += `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #0a0a0a; border-radius: 6px; margin-bottom: 4px;">
                                <span style="font-size: 12px; color: #e5e5e5;">${model.id}</span>
                                ${exists ? 
                                    '<span style="font-size: 11px; color: #4caf50;">已添加</span>' :
                                    `<button class="form-btn primary" style="padding: 4px 12px; font-size: 11px;" 
                                             onclick="addDiscoveredModel('${provider}', '${model.id}')">添加</button>`
                                }
                            </div>
                        `;
                    });
                    
                    html += `</div>`;
                }
                
                html += '</div>';
                resultDiv.innerHTML = html;
                
            } catch (error) {
                console.error('拉取模型失败:', error);
                resultDiv.innerHTML = '<p style="color: #f44336;">拉取失败，请检查网络连接</p>';
            }
        }
        
        async function addDiscoveredModel(provider, modelId) {
            const providerConfigs = {
                "DeepSeek": {
                    "base_url": "https://api.deepseek.com",
                    "api_key_env": "DEEPSEEK_API_KEY"
                },
                "OpenAI": {
                    "base_url": "https://api.openai.com/v1",
                    "api_key_env": "OPENAI_API_KEY"
                },
                "阿里云": {
                    "base_url": "https://dashscope.aliyuncs.com/compatible-mode/v1",
                    "api_key_env": "DASHSCOPE_API_KEY"
                },
                "智谱AI": {
                    "base_url": "https://open.bigmodel.cn/api/paas/v4",
                    "api_key_env": "ZHIPU_API_KEY"
                },
                "百度": {
                    "base_url": "https://qianfan.baidubce.com/v2",
                    "api_key_env": "BAIDU_API_KEY"
                }
            };
            
            const config = providerConfigs[provider] || {
                "base_url": "https://api.openai.com/v1",
                "api_key_env": "CUSTOM_API_KEY"
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/models/add-custom`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: modelId,
                        name: modelId,
                        provider: provider,
                        model_id: modelId,
                        base_url: config.base_url,
                        api_key_env: config.api_key_env,
                        description: `从${provider}添加的模型`,
                        features: ["对话"]
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`✅ 模型 ${modelId} 已添加`);
                    await loadModels();
                    renderModelPanel();
                    discoverModels();
                } else {
                    alert(`❌ 添加失败: ${data.message}`);
                }
            } catch (error) {
                console.error('添加模型失败:', error);
                alert('❌ 添加失败，请检查网络连接');
            }
        }
        
        function renderApiConfigSection() {
            // 获取所有提供商的API配置状态
            const providers = {};
            allModels.forEach(model => {
                if (!providers[model.provider]) {
                    providers[model.provider] = {
                        env_name: model.api_key_env || `API_KEY_${model.provider.toUpperCase()}`,
                        configured: model.api_key_configured,
                        api_key: model.api_key || ''
                    };
                }
            });
            
            let html = `
                <div class="api-config-section">
                    <div class="api-config-title">🔑 API 配置</div>
            `;
            
            for (const [provider, config] of Object.entries(providers)) {
                const statusClass = config.configured ? 'status-configured' : 'status-not-configured';
                const statusText = config.configured ? '● 已配置' : '● 未配置';
                const maskedKey = config.api_key ? maskApiKey(config.api_key) : '未设置';
                
                html += `
                    <div class="api-config-item">
                        <div class="api-config-header">
                            <span class="api-config-provider">${provider}</span>
                            <span class="api-config-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="api-config-key">${maskedKey}</div>
                        <div class="api-config-input-wrapper">
                            <input 
                                type="password" 
                                class="api-config-input" 
                                id="api-key-${provider}"
                                placeholder="输入 ${provider} API Key"
                                value="${config.api_key || ''}"
                            >
                            <button 
                                class="api-config-save-btn" 
                                onclick="saveApiKey('${provider}', '${config.env_name}')"
                            >
                                保存
                            </button>
                        </div>
                    </div>
                `;
            }
            
            html += `</div>`;
            return html;
        }
        
        function maskApiKey(key) {
            if (!key || key.length < 12) return '未设置';
            return key.substring(0, 8) + '...' + key.substring(key.length - 4);
        }
        
        async function saveApiKey(provider, envName) {
            const input = document.getElementById(`api-key-${provider}`);
            const apiKey = input.value.trim();
            
            if (!apiKey) {
                addMessage('ai', `❌ 请输入 ${provider} 的 API Key`);
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/models/api-keys`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        env_name: envName,
                        api_key: apiKey
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addMessage('ai', `✅ ${provider} API Key 已保存`);
                    // 重新加载模型列表
                    await loadModels();
                    renderModelPanel();
                } else {
                    addMessage('ai', `❌ 保存失败: ${data.message}`);
                }
            } catch (error) {
                console.error('保存API Key失败:', error);
                addMessage('ai', '❌ 保存失败，请检查网络连接');
            }
        }
        
        async function selectModelFromPanel(modelId) {
            await switchModel(modelId);
            updateModelSelector(allModels, modelId);
            renderModelPanel();
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 添加用户消息到界面
            addMessage('user', message);
            input.value = '';
            
            // 显示输入指示器
            showTypingIndicator();
            
            try {
                // 发送请求到后端
                const response = await fetch(`${API_BASE}/api/chat/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        message: message,
                        enable_tts: true
                    })
                });
                
                const data = await response.json();
                
                // 隐藏输入指示器
                hideTypingIndicator();
                
                if (data.success) {
                    // 添加AI回复到界面
                    addMessage('ai', data.reply, data.audio_base64);
                } else {
                    addMessage('ai', '抱歉，出现了错误，请稍后重试。');
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('ai', '抱歉，无法连接到服务器。');
                console.error('Error:', error);
            }
        }
        
        function addMessage(role, content, audioBase64 = null) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const time = new Date().toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            let avatarContent = role === 'ai' ? '🤖' : '👤';
            if (role === 'ai' && currentCharacter) {
                if (currentCharacter.avatar.startsWith('data:')) {
                    avatarContent = `<img src="${currentCharacter.avatar}" alt="avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                } else {
                    avatarContent = currentCharacter.avatar;
                }
            }
            
            let audioButton = '';
            if (audioBase64 && role === 'ai') {
                audioButton = `
                    <button class="play-audio-btn" onclick="playAudio('${audioBase64}')">
                        🔊 播放语音
                    </button>
                `;
            }
            
            messageDiv.innerHTML = `
                <div class="avatar">${avatarContent}</div>
                <div class="message-bubble">
                    ${content}
                    ${audioButton}
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function playAudio(base64Audio) {
            audioPlayer.src = `data:audio/mp3;base64,${base64Audio}`;
            audioPlayer.play();
        }
        
        function showTypingIndicator() {
            document.getElementById('typingIndicator').classList.add('show');
        }
        
        function hideTypingIndicator() {
            document.getElementById('typingIndicator').classList.remove('show');
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function closeAllPanels() {
            document.getElementById('modelPanel').classList.remove('show');
            document.getElementById('characterPanel').classList.remove('show');
            document.getElementById('worldbookPanel').classList.remove('show');
            document.getElementById('settingsPanel').classList.remove('show');
            document.getElementById('helpPanel').classList.remove('show');
            document.getElementById('modelOverlay').classList.remove('show');
        }
        
        function toggleModelPanel() {
            closeAllPanels();
            const panel = document.getElementById('modelPanel');
            const overlay = document.getElementById('modelOverlay');
            panel.classList.toggle('show');
            overlay.classList.toggle('show');
            
            if (panel.classList.contains('show')) {
                renderModelPanel();
            }
        }
        
        async function loadCharacters() {
            try {
                const response = await fetch(`${API_BASE}/api/characters/list`);
                const data = await response.json();
                
                if (data.success) {
                    allCharacters = data.characters;
                    currentCharacterId = data.current_character;
                }
            } catch (error) {
                console.error('加载角色列表失败:', error);
            }
        }
        
        function toggleCharacterPanel() {
            closeAllPanels();
            const panel = document.getElementById('characterPanel');
            const overlay = document.getElementById('modelOverlay');
            panel.classList.toggle('show');
            overlay.classList.toggle('show');
            
            if (panel.classList.contains('show')) {
                renderCharacterPanel();
            }
        }
        
        function renderCharacterPanel() {
            const body = document.getElementById('characterPanelBody');
            
            let html = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h3 style="margin: 0; font-size: 16px;">选择角色</h3>
                    <div style="display: flex; gap: 8px;">

        function importCharacterCard() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,.png';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    let characterData;
                    
                    if (file.name.endsWith('.png')) {
                        // PNG角色卡（包含嵌入的JSON数据）
                        characterData = await parsePngCharacterCard(file);
                    } else if (file.name.endsWith('.json')) {
                        // JSON角色卡
                        const text = await file.text();
                        characterData = JSON.parse(text);
                    } else {
                        alert('仅支持 .json 和 .png 格式的角色卡文件');
                        return;
                    }
                    
                    if (!characterData) {
                        alert('无法解析角色卡数据');
                        return;
                    }
                    
                    // 填充到创建表单
                    showCreateCharacterForm();
                    
                    // 等待表单渲染完成
                    setTimeout(() => {
                        document.getElementById('charFormId').value = characterData.id || generateCharacterId(characterData.name);
                        document.getElementById('charFormName').value = characterData.name || '';
                        document.getElementById('charFormAvatar').value = characterData.avatar || '🤖';
                        document.getElementById('charFormDesc').value = characterData.description || '';
                        document.getElementById('charFormPersonality').value = characterData.personality || '';
                        document.getElementById('charFormGreeting').value = characterData.greeting || '';
                        document.getElementById('charFormSystemPrompt').value = characterData.system_prompt || characterData.persona || '';
                        document.getElementById('charFormTags').value = (characterData.tags || []).join(', ');
                        
                        // 如果有头像图片数据
                        if (characterData.avatar_image) {
                            updateAvatarPreview(characterData.avatar_image);
                        }
                        
                        alert('✅ 角色卡已导入，请检查信息后点击"保存"');
                    }, 100);
                    
                } catch (error) {
                    console.error('导入角色卡失败:', error);
                    alert('❌ 导入失败: ' + error.message);
                }
            };
            input.click();
        }
        
        function generateCharacterId(name) {
            if (!name) return 'character_' + Date.now();
            return name.toLowerCase()
                .replace(/[^a-z0-9\u4e00-\u9fa5]/g, '_')
                .replace(/_{2,}/g, '_')
                .substring(0, 30) || 'character_' + Date.now();
        }
        
        async function parsePngCharacterCard(file) {
            // 尝试从PNG文件中提取嵌入的JSON数据
            // 支持常见的角色卡格式（如TavernAI、SillyTavern等）
            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);
            
            // 查找PNG中的tEXt块（文本数据块）
            let offset = 8; // 跳过PNG签名
            while (offset < uint8Array.length - 12) {
                const length = (uint8Array[offset] << 24) | (uint8Array[offset + 1] << 16) | (uint8Array[offset + 2] << 8) | uint8Array[offset + 3];
                const chunkType = String.fromCharCode(...uint8Array.slice(offset + 4, offset + 8));
                
                if (chunkType === 'tEXt' || chunkType === 'iTXt' || chunkType === 'zTXt') {
                    const textData = new TextDecoder().decode(uint8Array.slice(offset + 8, offset + 8 + length));
                    
                    // 尝试解析JSON
                    try {
                        // TavernAI格式：chara字段是Base64编码的JSON
                        if (textData.startsWith('chara')) {
                            const base64Data = textData.substring(5);
                            const jsonStr = atob(base64Data);
                            return JSON.parse(jsonStr);
                        }
                        
                        // 直接JSON
                        if (textData.trim().startsWith('{')) {
                            return JSON.parse(textData);
                        }
                    } catch (e) {
                        // 继续查找下一个文本块
                    }
                }
                
                offset += 12 + length; // 4字节长度 + 4字节类型 + 数据 + 4字节CRC
            }
            
            throw new Error('PNG文件中未找到角色卡数据');
        }
        
        async function saveCurrentCharacter() {
            const charFormId = document.getElementById('charFormId');
            const charFormName = document.getElementById('charFormName');
            
            if (!charFormId || !charFormName) {
                alert('请先创建或编辑一个角色');
                return;
            }
            
            const characterId = charFormId.value.trim();
            const name = charFormName.value.trim();
            
            if (!characterId || !name) {
                alert('请填写角色ID和名称');
                return;
            }
            
            const avatar = document.getElementById('charFormAvatar').value.trim();
            const description = document.getElementById('charFormDesc').value.trim();
            const personality = document.getElementById('charFormPersonality').value.trim();
            const greeting = document.getElementById('charFormGreeting').value.trim();
            const system_prompt = document.getElementById('charFormSystemPrompt').value.trim();
            const tagsStr = document.getElementById('charFormTags').value.trim();
            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];
            
            try {
                const existingChar = allCharacters.find(c => c.id === characterId);
                let response;
                
                if (existingChar) {
                    response = await fetch(`${API_BASE}/api/characters/update/${characterId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, description, personality, greeting, system_prompt, avatar, tags })
                    });
                } else {
                    response = await fetch(`${API_BASE}/api/characters/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: characterId, name, description, personality, greeting, system_prompt, avatar, tags })
                    });
                }
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ 保存成功！');
                    hideCharacterForm();
                    await loadCharacters();
                    renderCharacterPanel();
                } else {
                    alert('❌ 保存失败: ' + data.message);
                }
            } catch (error) {
                console.error('保存角色失败:', error);
                alert('❌ 保存失败，请检查网络连接');
            }
        }

        function importWorldbook() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    const text = await file.text();
                    let worldbookData;
                    
                    try {
                        worldbookData = JSON.parse(text);
                    } catch (parseError) {
                        alert('JSON格式错误: ' + parseError.message);
                        return;
                    }
                    
                    // 支持单个条目或条目数组
                    const entries = Array.isArray(worldbookData) ? worldbookData : [worldbookData];
                    
                    let importedCount = 0;
                    let skippedCount = 0;
                    
                    for (const entry of entries) {
                        // 验证必要字段
                        if (!entry.title || !entry.content) {
                            skippedCount++;
                            continue;
                        }
                        
                        // 生成ID（如果没有）
                        const entryId = entry.id || 'wb_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
                        
                        const data = {
                            id: entryId,
                            title: entry.title,
                            content: entry.content,
                            category: entry.category || 'general',
                            tags: entry.tags || [],
                            is_active: entry.is_active !== undefined ? entry.is_active : true
                        };
                        
                        try {
                            const response = await fetch(`${API_BASE}/api/worldbook/create`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(data)
                            });
                            
                            const result = await response.json();
                            if (result.success) {
                                importedCount++;
                            } else {
                                skippedCount++;
                            }
                        } catch (err) {
                            skippedCount++;
                        }
                    }
                    
                    await loadWorldbook();
                    renderWorldbookPanel();
                    
                    let msg = `✅ 导入完成！成功导入 ${importedCount} 个条目`;
                    if (skippedCount > 0) {
                        msg += `，跳过 ${skippedCount} 个无效条目`;
                    }
                    alert(msg);
                    
                } catch (error) {
                    console.error('导入世界书失败:', error);
                    alert('❌ 导入失败: ' + error.message);
                }
            };
            input.click();
        }

                    console.error('加载设置失败:', e);
                }
            }
        }
        
        function saveSettings() {
            localStorage.setItem('chatSettings', JSON.stringify(chatSettings));
        }
        
        function renderSettingsPanel() {
            const body = document.getElementById('settingsPanelBody');
            
            let html = `
                <div class="settings-section">
                    <div class="settings-title">🔑 API Key 配置</div>
                    <p style="font-size: 12px; color: #737373; margin-bottom: 16px;">
                        配置各模型的API Key后才能使用对应模型。Key会安全保存在服务器的.env文件中。
                    </p>
                    <div id="apiKeyConfigContainer">
                        <p style="text-align: center; color: #737373; padding: 20px;">加载中...</p>
                    </div>
                </div>
                
                <hr style="border: none; border-top: 1px solid #262626; margin: 20px 0;">
                
                <div class="settings-section">
                    <div class="settings-title">🌡️ 温度 (Temperature)</div>
                    <div class="slider-container">
                        <input type="range" min="0" max="100" value="${chatSettings.temperature * 100}" 
                               oninput="updateTemperature(this.value)">
                        <span class="slider-value">${chatSettings.temperature.toFixed(2)}</span>
                    </div>
                    <p style="font-size: 12px; color: #737373; margin-top: 8px;">
                        控制回复的创造性。值越高越有创意，值越低越保守。
                    </p>
                </div>
                
                <div class="settings-section">
                    <div class="settings-title"> 最大Token数</div>
                    <div class="slider-container">
                        <input type="range" min="500" max="4000" step="100" value="${chatSettings.max_tokens}" 
                               oninput="updateMaxTokens(this.value)">
                        <span class="slider-value">${chatSettings.max_tokens}</span>
                    </div>
                    <p style="font-size: 12px; color: #737373; margin-top: 8px;">
                        限制AI回复的最大长度。
                    </p>
                </div>
                
                <div class="settings-section">
                    <div class="settings-title"> Top P</div>
                    <div class="slider-container">
                        <input type="range" min="0" max="100" value="${chatSettings.top_p * 100}" 
                               oninput="updateTopP(this.value)">
                        <span class="slider-value">${chatSettings.top_p.toFixed(2)}</span>
                    </div>
                    <p style="font-size: 12px; color: #737373; margin-top: 8px;">
                        控制回复的多样性。值越高越多样化。
                    </p>
                </div>
            `;
            
            body.innerHTML = html;
            
            // 加载API Key配置
            loadApiKeyConfig();
        }
        
        async function loadApiKeyConfig() {
            const container = document.getElementById('apiKeyConfigContainer');
            if (!container) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/models/api-keys`);
                const data = await response.json();
                
                if (!data.success || !data.providers) {
                    container.innerHTML = '<p style="color: #f44336;">加载API Key配置失败</p>';
                    return;
                }
                
                let html = '';
                for (const [provider, config] of Object.entries(data.providers)) {
                    const statusIcon = config.configured ? '✅' : '';
                    const statusText = config.configured ? '已配置' : '未配置';
                    const maskedKey = config.masked_key || '';
                    
                    html += `
                        <div class="api-key-item" style="background: #171717; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #262626;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span style="font-size: 14px; font-weight: 600; color: #e5e5e5;">${statusIcon} ${provider}</span>
                                <span style="font-size: 12px; color: ${config.configured ? '#4caf50' : '#f44336'};">${statusText}</span>
                            </div>
                            ${maskedKey ? `<p style="font-size: 11px; color: #737373; margin-bottom: 8px;">当前Key: ${maskedKey}</p>` : ''}
                            <div style="display: flex; gap: 8px;">
                                <input type="password" id="apiKey_${provider}" placeholder="输入API Key" 
                                       style="flex: 1; padding: 8px 12px; border: 1px solid #262626; border-radius: 6px; background: #0a0a0a; color: #e5e5e5; font-size: 13px;">
                                <button class="form-btn primary" onclick="saveApiKey('${provider}', '${config.env_name}')" 
                                        style="padding: 8px 16px; white-space: nowrap;">保存</button>
                            </div>
                        </div>
                    `;
                }
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error('加载API Key配置失败:', error);
                container.innerHTML = '<p style="color: #f44336;">加载失败，请检查网络连接</p>';
            }
        }
        
        async function saveApiKey(provider, envName) {
            const input = document.getElementById(`apiKey_${provider}`);
            const apiKey = input.value.trim();
            
            if (!apiKey) {
                alert('请输入API Key');
                return;
            }
            
            const btn = input.nextElementSibling;
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '保存中...';
            
            try {
                const response = await fetch(`${API_BASE}/api/models/api-keys`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        env_name: envName,
                        api_key: apiKey
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ API Key保存成功！');
                    input.value = '';
                    // 重新加载配置
                    await loadApiKeyConfig();
                    // 重新加载模型列表
                    await loadModels();
                } else {
                    alert('❌ 保存失败: ' + data.message);
                }
            } catch (error) {
                console.error('保存API Key失败:', error);
                alert(' 保存失败，请检查网络连接');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
        
        function updateTemperature(value) {
            chatSettings.temperature = value / 100;
            document.querySelector('.slider-value').textContent = chatSettings.temperature.toFixed(2);
            saveSettings();
        }
        
        function updateMaxTokens(value) {
            chatSettings.max_tokens = parseInt(value);
            saveSettings();
        }
        
        function updateTopP(value) {
            chatSettings.top_p = value / 100;
            saveSettings();
        }
        
        // ===== 角色独立聊天界面 =====
        let chatHistories = {};
        let lastDeletedMessage = localStorage.getItem('lastDeletedMessage') ? JSON.parse(localStorage.getItem('lastDeletedMessage')) : null;
        
        function loadChatForCharacter(characterId) {
            const saved = localStorage.getItem(`chat_${characterId}`);
            chatHistories[characterId] = saved ? JSON.parse(saved) : [];
            renderChatMessages(characterId);
        }
        
        function saveChatForCharacter(characterId) {
            localStorage.setItem(`chat_${characterId}`, JSON.stringify(chatHistories[characterId] || []));
        }
        
        function renderChatMessages(characterId) {
            const messagesContainer = document.getElementById('chatMessages');
            const messages = chatHistories[characterId] || [];
            
            if (messages.length === 0) {
                const char = allCharacters.find(c => c.id === characterId);
                messagesContainer.innerHTML = `
                    <div class="message ai">
                        <div class="avatar">${char ? char.avatar : '🤖'}</div>
                        <div class="message-bubble">
                            ${char ? char.greeting : '你好！有什么可以帮助你的吗？'}
                            <div class="message-time">刚刚</div>
                        </div>
                    </div>
                `;
                return;
            }
            
            messagesContainer.innerHTML = '';
            messages.forEach(msg => {
                addMessageToContainer(msg.role, msg.content, msg.time, msg.id, false);
            });
        }
        
        function addMessageToContainer(role, content, time, msgId, saveToHistory = true) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.id = `msg-${msgId}`;
            
            messageDiv.innerHTML = `
                <div class="avatar">${role === 'ai' ? (allCharacters.find(c => c.id === currentCharacterId)?.avatar || '🤖') : '👤'}</div>
                <div class="message-bubble">
                    ${content}
                    <div class="message-actions">
                        <button class="msg-action-btn" onclick="deleteMessage('${msgId}')" title="删除">🗑️</button>
                    </div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            if (saveToHistory) {
                if (!chatHistories[currentCharacterId]) {
                    chatHistories[currentCharacterId] = [];
                }
                chatHistories[currentCharacterId].push({ role, content, time, id: msgId });
                saveChatForCharacter(currentCharacterId);
            }
        }
        
        function deleteMessage(msgId) {
            const msgEl = document.getElementById(`msg-${msgId}`);
            if (msgEl) {
                const messages = chatHistories[currentCharacterId] || [];
                const msgIndex = messages.findIndex(m => m.id === msgId);
                if (msgIndex !== -1) {
                    lastDeletedMessage = { ...messages[msgIndex], index: msgIndex };
                    localStorage.setItem('lastDeletedMessage', JSON.stringify(lastDeletedMessage));
                    messages.splice(msgIndex, 1);
                    saveChatForCharacter(currentCharacterId);
                }
                msgEl.remove();
            }
        }
        
        function undoDelete() {
            if (lastDeletedMessage) {
                const messages = chatHistories[currentCharacterId] || [];
                messages.splice(lastDeletedMessage.index, 0, {
                    role: lastDeletedMessage.role,
                    content: lastDeletedMessage.content,
                    time: lastDeletedMessage.time,
                    id: lastDeletedMessage.id
                });
                saveChatForCharacter(currentCharacterId);
                renderChatMessages(currentCharacterId);
                lastDeletedMessage = null;
                localStorage.removeItem('lastDeletedMessage');
            }
        }
        
        function clearCurrentChat() {
            if (!confirm('确定要清空当前角色的聊天记录吗？')) return;
            chatHistories[currentCharacterId] = [];
            saveChatForCharacter(currentCharacterId);
            renderChatMessages(currentCharacterId);
        }
        
        function recallLastMessage() {
            const messages = chatHistories[currentCharacterId] || [];
            if (messages.length >= 2) {
                messages.pop();
                messages.pop();
                saveChatForCharacter(currentCharacterId);
                renderChatMessages(currentCharacterId);
            } else if (messages.length > 0) {
                messages.pop();
                saveChatForCharacter(currentCharacterId);
                renderChatMessages(currentCharacterId);
            }
        }
        
        // 重写sendMessage函数以使用新的消息系统
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const msgId = 'msg-' + Date.now();
            
            addMessageToContainer('user', message, time, msgId);
            input.value = '';
            
            showTypingIndicator();
            
            try {
                const response = await fetch(`${API_BASE}/api/chat/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        message: message,
                        enable_tts: true
                    })
                });
                
                const data = await response.json();
                hideTypingIndicator();
                
                if (data.success) {
                    const aiTime = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    const aiMsgId = 'msg-' + (Date.now() + 1);
                    addMessageToContainer('ai', data.reply, aiTime, aiMsgId);
                } else {
                    addMessage('ai', '抱歉，出现了错误，请稍后重试。');
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('ai', '抱歉，无法连接到服务器。');
                console.error('Error:', error);
            }
        }

            overlay.classList.toggle('show');

                renderHelpPanel();
            }
        }

                    </div>

    </script>
