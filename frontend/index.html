        function addMessageToContainer(role, content, time, msgId, saveToHistory = true, showUndoButton = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.id = `msg-${msgId}`;
            
            const escapedContent = content.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
            
            // 撤回按钮（仅重说后显示）
            const undoButton = showUndoButton ? `
                <button class="msg-action-btn undo-btn" onclick="undoRegenerate()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    撤回
                </button>
            ` : '';
            
            const actionButtons = `
                <div class="message-actions-bar">
                    ${undoButton}
                    <button class="msg-action-btn" onclick="copyMessage(this, '${escapedContent}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        复制
                    </button>
                    <button class="msg-action-btn" onclick="deleteSingleMessage(this, '${msgId}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        删除
                    </button>
                    <button class="msg-action-btn" onclick="backtrackMessage(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        回溯
                    </button>
                    <button class="msg-action-btn" onclick="continueMessage(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        继续
                    </button>
                    ${role === 'ai' ? `
                    <button class="msg-action-btn" onclick="regenerateMessage(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        重说
                    </button>
                    ` : ''}
                </div>
            `;
            
            messageDiv.innerHTML = `
                <div class="avatar">${role === 'ai' ? (allCharacters.find(c => c.id === currentCharacterId)?.avatar || '🤖') : '👤'}</div>
                <div class="message-wrapper">
                    <div class="message-bubble">
                        ${content}
                        <div class="message-time">${time}</div>
                    </div>
                    ${actionButtons}
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            if (saveToHistory) {
                if (!chatHistories[currentCharacterId]) {
                    chatHistories[currentCharacterId] = [];
                }
                chatHistories[currentCharacterId].push({ role, content, time, id: msgId });
                saveChatForCharacter(currentCharacterId);
            }
        }
        
        async function deleteSingleMessage(btn, msgId) {
            if (!confirm('确定要删除这条消息吗？')) return;

            const msgEl = document.getElementById(`msg-${msgId}`);
            if (msgEl) {
                // 调用后端API删除数据库中的记录
                try {
                    if (msgId && currentCharacterId) {
                        const deleteResponse = await fetch(`${API_BASE}/api/chat/delete-message`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                user_id: USER_ID,
                                message_id: msgId
                            })
                        });

                        const deleteData = await deleteResponse.json();
                        if (deleteData.success) {
                            console.log('[删除消息] 已从数据库删除消息 ID:', msgId);
                        } else {
                            console.warn('[删除消息] 后端删除失败:', deleteData.message);
                            showToast('后端删除失败: ' + deleteData.message, 'error');
                        }
                    }
                } catch (error) {
                    console.error('[删除消息] 调用后端API失败:', error);
                }

                // 从本地历史中删除
                const messages = chatHistories[currentCharacterId] || [];
                const msgIndex = messages.findIndex(m => m.id == msgId);
                if (msgIndex !== -1) {
                    messages.splice(msgIndex, 1);
                    saveChatForCharacter(currentCharacterId);
                }
                
                // 从DOM中删除
                msgEl.remove();
                
                showToast('消息已删除', 'success');
            }
        }
        
        async function deleteMessage(msgId) {
            const msgEl = document.getElementById(`msg-${msgId}`);
            if (msgEl) {
                // 调用后端API删除数据库记录
                try {
                    if (msgId && currentCharacterId) {
                        const deleteResponse = await fetch(`${API_BASE}/api/chat/delete-message`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                user_id: USER_ID,
                                message_id: msgId
                            })
                        });

                        const deleteData = await deleteResponse.json();
                        if (deleteData.success) {
                            console.log('[删除消息] 已从数据库删除消息 ID:', msgId);
                        } else {
                            console.warn('[删除消息] 后端删除失败:', deleteData.message);
                        }
                    }
                } catch (error) {
                    console.error('[删除消息] 调用后端API失败:', error);
                }

                const messages = chatHistories[currentCharacterId] || [];
                const msgIndex = messages.findIndex(m => m.id === msgId);
                if (msgIndex !== -1) {
                    lastDeletedMessage = { ...messages[msgIndex], index: msgIndex };
                    localStorage.setItem('lastDeletedMessage', JSON.stringify(lastDeletedMessage));
                    messages.splice(msgIndex, 1);
                    saveChatForCharacter(currentCharacterId);
                }
                msgEl.remove();
            }
        }
        
        function undoDelete() {
            if (lastDeletedMessage) {
                const messages = chatHistories[currentCharacterId] || [];
                messages.splice(lastDeletedMessage.index, 0, {
                    role: lastDeletedMessage.role,
                    content: lastDeletedMessage.content,
                    time: lastDeletedMessage.time,
                    id: lastDeletedMessage.id
                });
                saveChatForCharacter(currentCharacterId);
                renderChatMessages(currentCharacterId);
                lastDeletedMessage = null;
                localStorage.removeItem('lastDeletedMessage');
            }
        }
        
        function clearCurrentChat() {
            if (!confirm('确定要清空当前角色的聊天记录吗？')) return;
            chatHistories[currentCharacterId] = [];
            saveChatForCharacter(currentCharacterId);
            renderChatMessages(currentCharacterId);
        }
        
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('地址已复制到剪贴板', 'success');
                }).catch(() => {
                    fallbackCopyToClipboard(text);
                });
            } else {
                fallbackCopyToClipboard(text);
            }
        }
        
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('地址已复制到剪贴板', 'success');
            } catch (err) {
                showToast('复制失败，请手动复制', 'error');
            }
            document.body.removeChild(textArea);
        }
        
        function recallLastMessage() {
            const messages = chatHistories[currentCharacterId] || [];
            if (messages.length >= 2) {
                messages.pop();
                messages.pop();
                saveChatForCharacter(currentCharacterId);
                renderChatMessages(currentCharacterId);
            } else if (messages.length > 0) {
                messages.pop();
                saveChatForCharacter(currentCharacterId);
                renderChatMessages(currentCharacterId);
            }
        }
        
        // 重写sendMessage函数以使用新的消息系统
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const tempMsgId = Date.now();
            
            addMessageToContainer('user', message, time, tempMsgId);
            input.value = '';
            
            showTypingIndicator();
            
            try {
                const response = await fetch(`${API_BASE}/api/chat/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        message: message,
                        enable_tts: true
                    })
                });
                
                const data = await response.json();
                hideTypingIndicator();
                
                if (data.success) {
                    const aiTime = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    
                    const userDbId = data.metadata?.user_msg_id;
                    const aiDbId = data.metadata?.ai_msg_id;
                    
                    if (userDbId) {
                        const userMsgEl = document.getElementById(`msg-${tempMsgId}`);
                        if (userMsgEl) {
                            userMsgEl.id = `msg-${userDbId}`;
                        }
                        
                        const messages = chatHistories[currentCharacterId] || [];
                        const lastMsg = messages[messages.length - 1];
                        if (lastMsg && lastMsg.id == tempMsgId) {
                            lastMsg.id = userDbId;
                            saveChatForCharacter(currentCharacterId);
                        }
                    }
                    
                    const aiMsgId = aiDbId || (Date.now() + 1);
                    addMessageToContainer('ai', data.reply, aiTime, aiMsgId);
                    
                    refreshContext();
                } else {
                    addMessage('ai', '抱歉，出现了错误，请稍后重试。');
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('ai', '抱歉，无法连接到服务器。');
                console.error('Error:', error);
            }
        }

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) {
                const container = document.createElement('div');
                container.id = 'toastContainer';
                container.style.cssText = 'position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 10px;';
                document.body.appendChild(container);
            }
            
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : type === 'warning' ? '#f59e0b' : '#555555';
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
            
            toast.style.cssText = `background: ${bgColor}; color: white; padding: 14px 18px; border-radius: 12px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: toastSlideIn 0.3s ease-out; min-width: 280px; max-width: 380px; backdrop-filter: blur(8px);`;
            toast.innerHTML = `${icon} ${message}`;
            
            document.getElementById('toastContainer').appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastSlideOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function renderVoiceConfigPanel() {
            const body = document.getElementById('voiceConfigPanelBody');
            body.innerHTML = '<p style="text-align: center; color: #737373;">加载中...</p>';
            
            try {
                // 获取所有角色
                const charResponse = await fetch(`${API_BASE}/api/characters/list`);
                if (!charResponse.ok) {
                    throw new Error(`HTTP错误: ${charResponse.status}`);
                }
                const charData = await charResponse.json();
                
                // 获取所有语音配置
                const voiceResponse = await fetch(`${API_BASE}/api/voice-configs/list?user_id=${USER_ID}`);
                if (!voiceResponse.ok) {
                    throw new Error(`HTTP错误: ${voiceResponse.status}`);
                }
                const voiceData = await voiceResponse.json();
                
                if (!charData.success) {
                    body.innerHTML = '<p style="color: #f44336;">加载角色失败</p>';
                    return;
                }
                
                const configs = voiceData.success ? voiceData.configs : [];
                const configMap = {};
                configs.forEach(config => {
                    configMap[config.character_id] = config;
                });
                
                let html = `
                    <div style="margin-bottom: 16px;">
                        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                            <button class="form-btn" onclick="showTtsConfigManager()" style="flex: 1;">
                                🔧 TTS API配置
                            </button>
                        </div>
                        <p style="font-size: 13px; color: #a3a3a3; margin-bottom: 12px;">
                            为每个角色配置个性化的语音设置，包括音色、语速等
                        </p>
                    </div>
                `;
                
                if (charData.characters.length === 0) {
                    html += '<p style="text-align: center; color: #737373; padding: 40px 0;">暂无角色，请先创建角色</p>';
                } else {
                    for (const character of charData.characters) {
                        const config = configMap[character.id];
                        const hasConfig = !!config;
                        const configInfo = hasConfig 
                            ? `<div style="font-size: 12px; color: #737373; margin-top: 6px;">
                                 音色: ${config.tts_voice} | 语速: ${config.speed}x
                               </div>`
                            : '<div style="font-size: 12px; color: #525252; margin-top: 6px;">未配置</div>';
                        
                        html += `
                            <div class="config-card" style="background: #171717; border: 1px solid #262626; border-radius: 10px; padding: 14px; margin-bottom: 12px; cursor: pointer;" onclick="showVoiceConfigForm('${character.id}', '${character.name}')">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                                            <span style="font-size: 20px;">${character.avatar || '🤖'}</span>
                                            <span style="font-size: 14px; font-weight: 600; color: #e5e5e5;">${character.name}</span>
                                            ${hasConfig ? '<span style="background: #10b981; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px;">已配置</span>' : ''}
                                        </div>
                                        ${configInfo}
                                    </div>
                                    <span style="font-size: 18px; color: #737373;">›</span>
                                </div>
                            </div>
                        `;
                    }
                }
                
                body.innerHTML = html;
                
            } catch (error) {
                console.error('加载语音配置失败:', error);
                body.innerHTML = `<p style="color: #f44336;">加载失败: ${error.message}</p>`;
            }
        }

        async function saveVoiceConfig(characterId) {
            const configData = {
                user_id: USER_ID,
                character_id: characterId,
                tts_voice: document.getElementById('voiceTtsVoice').value,
                speed: parseFloat(document.getElementById('voiceSpeed').value),
                volume: parseFloat(document.getElementById('voiceVolume').value),
                pitch: parseFloat(document.getElementById('voicePitch').value),
                audio_format: document.getElementById('voiceAudioFormat').value,
                enable_tts: document.getElementById('voiceEnableTts').checked,
                auto_play: document.getElementById('voiceAutoPlay').checked
            };
            
            showToast('正在保存配置...', 'info');
            
            try {
                // 先检查是否已存在配置
                const checkResponse = await fetch(`${API_BASE}/api/voice-configs/get?character_id=${characterId}&user_id=${USER_ID}`);
                const checkData = await checkResponse.json();
                
                let response;
                if (checkData.success) {
                    // 更新现有配置
                    response = await fetch(`${API_BASE}/api/voice-configs/update/${characterId}?user_id=${USER_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(configData)
                    });
                } else {
                    // 创建新配置
                    response = await fetch(`${API_BASE}/api/voice-configs/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(configData)
                    });
                }
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('配置保存成功', 'success');
                    renderVoiceConfigPanel();
                } else {
                    showToast('保存失败：' + (data.message || '未知错误'), 'error');
                }
            } catch (error) {
                showToast('保存失败，请检查网络连接', 'error');
            }
        }
        
        async function deleteVoiceConfig(characterId) {
            if (!confirm('确定要删除该角色的语音配置吗？')) {
                return;
            }
            
            showToast('正在删除配置...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/api/voice-configs/delete/${characterId}?user_id=${USER_ID}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('配置已删除', 'success');
                    renderVoiceConfigPanel();
                } else {
                    showToast('删除失败：' + (data.message || '未知错误'), 'error');
                }
            } catch (error) {
                showToast('删除失败，请检查网络连接', 'error');
            }
        }
        
        async function testVoiceConfig() {
            const voice = document.getElementById('voiceTtsVoice').value;
            const speed = parseFloat(document.getElementById('voiceSpeed').value);
            
            showToast('正在生成测试语音...', 'info');
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const response = await fetch(`${API_BASE}/api/chat/tts-test`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: '这是一段测试语音，用于测试语音配置效果。',
                        voice: voice,
                        speed: speed
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                const data = await response.json();
                
                if (data.success && data.audio_base64) {
                    const audio = new Audio(`data:audio/mp3;base64,${data.audio_base64}`);
                    audio.play();
                    showToast('正在播放测试语音', 'success');
                } else {
                    showToast('测试失败：' + (data.message || '未知错误'), 'error');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    showToast('测试失败：请求超时，请检查API配置和网络连接', 'error');
                } else {
                    showToast('测试失败：' + error.message, 'error');
                }
            }
        }

                    apiSpec: 'OpenAI',
                    baseUrl: 'https://api.siliconflow.cn/v1',
                    model: 'tts-1'
                },
                aliyun: {
                    name: '阿里云百炼TTS',
                    apiSpec: 'OpenAI',
                    baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1',
                    model: 'tts-1'
                },
                zhipu: {
                    name: '智谱AI TTS',
                    apiSpec: 'OpenAI',
                    baseUrl: 'https://open.bigmodel.cn/api/paas/v4',
                    model: 'tts-1'
                },
                openai: {
                    name: 'OpenAI TTS',
                    apiSpec: 'OpenAI',
                    baseUrl: 'https://api.openai.com/v1',
                    model: 'tts-1'

            const preset = presets[provider];
            if (preset) {
                document.getElementById('ttsConfigName').value = preset.name;

                document.getElementById('ttsBaseUrl').value = preset.baseUrl;
                document.getElementById('ttsModel').value = preset.model;

        function flattenMemoryTree(tree) {
            let result = [];
            for (const node of tree) {
                result.push(node);
                if (node.children && node.children.length > 0) {
                    result = result.concat(flattenMemoryTree(node.children));
                }
            }
            return result;
        }
        
        function renderMemoryTree(tree, level) {
            if (!tree || tree.length === 0) return '';
            
            let html = '';
            for (const node of tree) {
                const typeIcons = {
                    'fact': '📋', 'preference': '❤️', 'event': '🎯',
                    'relationship': '🤝', 'general': '📌'
                };
                const icon = typeIcons[node.memory_type] || '📌';
                const importanceStars = '★'.repeat(Math.min(node.importance || 1, 5)) + '☆'.repeat(Math.max(5 - (node.importance || 1), 0));
                const isActive = node.is_active !== false;
                const indent = level * 20;
                
                html += `
                    <div style="margin-left: ${indent}px; margin-bottom: 8px;">
                        <div style="background: #141414; border: 1px solid #222; border-left: 3px solid ${isActive ? '#3b82f6' : '#444'}; border-radius: 6px; padding: 10px; transition: all 0.15s;" onmouseover="this.style.borderColor='#3a3a3a'; this.style.background='#161616'" onmouseout="this.style.borderColor='#222'; this.style.background='#141414'">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <div style="display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0;">
                                    <span style="font-size: 16px; flex-shrink: 0;">${icon}</span>
                                    <div style="flex: 1; min-width: 0;">
                                        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                                            <span style="font-size: 13px; font-weight: 500; color: ${isActive ? '#e5e5e5' : '#666'};">${node.title}</span>
                                            ${node.memory_type ? `<span style="font-size: 10px; padding: 1px 6px; background: #1a1a1a; border-radius: 3px; color: #888;">${node.memory_type}</span>` : ''}
                                            ${!isActive ? '<span style="font-size: 10px; padding: 1px 6px; background: #2a1a1a; border-radius: 3px; color: #a66;">已停用</span>' : ''}
                                        </div>
                                        ${node.content ? `<div style="font-size: 11px; color: #888; line-height: 1.4; margin-top: 4px;">${node.content.length > 120 ? node.content.substring(0, 120) + '...' : node.content}</div>` : ''}
                                        <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 10px; color: #555;">
                                            <span style="color: #fbbf24;">${importanceStars}</span>
                                            ${node.tags && node.tags.length > 0 ? node.tags.map(t => `<span style="padding: 1px 4px; background: #1a1a1a; border-radius: 2px;">#${t}</span>`).join('') : ''}
                                        </div>
                                    </div>
                                </div>
                                <div style="display: flex; gap: 3px; margin-left: 8px; flex-shrink: 0;">
                                    <button onclick="editMemoryNode(${node.id})" style="background: none; border: none; color: #666; padding: 4px; cursor: pointer; font-size: 12px; border-radius: 3px; transition: all 0.15s;" onmouseover="this.style.color='#999'; this.style.background='#222'" onmouseout="this.style.color='#666'; this.style.background='none'" title="编辑">✏️</button>
                                    <button onclick="deleteMemoryNode(${node.id})" style="background: none; border: none; color: #666; padding: 4px; cursor: pointer; font-size: 12px; border-radius: 3px; transition: all 0.15s;" onmouseover="this.style.color='#f87171'; this.style.background='#222'" onmouseout="this.style.color='#666'; this.style.background='none'" title="删除">🗑️</button>
                                </div>
                            </div>
                        </div>
                        ${node.children && node.children.length > 0 ? renderMemoryTree(node.children, level + 1) : ''}
                    </div>
                `;
            }
            return html;
        }

        async function createMemoryNode(parentId) {
            const title = document.getElementById('memoryTitleInput').value.trim();
            const content = document.getElementById('memoryContentInput').value.trim();
            const memoryType = document.getElementById('memoryTypeInput').value;
            const importance = parseInt(document.getElementById('memoryImportanceInput').value);
            const tagsStr = document.getElementById('memoryTagsInput').value.trim();
            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];
            
            if (!title || !content) {
                showToast('请填写记忆标题和内容', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/memories/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        character_id: currentMemoryCharacter.id,
                        title: title,
                        content: content,
                        memory_type: memoryType,
                        parent_id: parentId,
                        importance: importance,
                        tags: tags
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('记忆创建成功', 'success');
                    loadMemoryTab();
                } else {
                    showToast('创建失败: ' + (data.message || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('创建记忆失败:', error);
                showToast('创建失败: ' + error.message, 'error');
            }
        }
        
        async function editMemoryNode(memoryId) {
            if (!currentMemoryCharacter) return;

                if (!memory) {

                    return;

                const container = document.getElementById('memoryTabContent');
                if (!container) return;
                
                container.innerHTML = `

                console.error('获取记忆详情失败:', error);
                showToast('获取记忆详情失败', 'error');

        async function updateMemoryNode(memoryId) {
            const title = document.getElementById('editMemoryTitle').value.trim();
            const content = document.getElementById('editMemoryContent').value.trim();
            const memoryType = document.getElementById('editMemoryType').value;
            const importance = parseInt(document.getElementById('editMemoryImportance').value);
            const isActive = document.getElementById('editMemoryActive').checked;
            const tagsStr = document.getElementById('editMemoryTags').value.trim();
            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];
            
            try {
                const response = await fetch(`${API_BASE}/api/memories/update/${memoryId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        memory_type: memoryType,
                        importance: importance,
                        is_active: isActive,
                        tags: tags
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('记忆更新成功', 'success');
                    loadMemoryTab();
                } else {
                    showToast('更新失败: ' + (data.message || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('更新记忆失败:', error);
                showToast('更新失败: ' + error.message, 'error');
            }
        }
        
        async function deleteMemoryNode(memoryId) {
            if (!confirm('确定要删除这条记忆吗？子记忆也会一起删除。')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/memories/delete/${memoryId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showToast('记忆删除成功', 'success');
                    loadMemoryTab();
                } else {
                    const msg = data.message || data.detail || '未知错误';
                    showToast('删除失败: ' + msg, 'error');
                }
            } catch (error) {
                console.error('删除记忆失败:', error);
                showToast('删除失败: ' + error.message, 'error');
            }
        }
        
        async function aiAnalyzeMemories() {
            if (!currentMemoryCharacter) return;
            
            if (!confirm('将使用当前对话记录进行AI记忆分析，是否继续？')) return;
            
            const container = document.getElementById('memoryTabContent');
            if (!container) return;
            
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px;">
                    <div style="font-size: 48px; margin-bottom: 16px; animation: spin 2s linear infinite;">🤖</div>

                    <p style="font-size: 12px; color: #737373; margin-top: 8px;">提取事实、偏好、事件和关系</p>
                    <style>
                        @keyframes spin {
                            from { transform: rotate(0deg); }
                            to { transform: rotate(360deg); }
                        }
                    </style>
                </div>
            `;
            
            try {
                const msgResponse = await fetch(`${API_BASE}/api/chat/messages?user_id=${USER_ID}&character_id=${currentMemoryCharacter.id}&limit=50`);

                if (!msgData.success || !msgData.messages || msgData.messages.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px 20px;">
                            <div style="font-size: 36px; margin-bottom: 12px;">⚠️</div>

                            <button onclick="loadMemoryTab()" style="margin-top: 16px; background: #222; border: 1px solid #333; color: #fff; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 12px;">返回</button>

                    `;
                    return;
                }
                
                const chatText = msgData.messages.map(m => `${m.role === 'user' ? '用户' : 'AI'}: ${m.content}`).join('\n');
                
                const response = await fetch(`${API_BASE}/api/memories/ai-analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        character_id: currentMemoryCharacter.id,
                        chat_messages: chatText
                    })

                const data = await response.json();
                
                if (data.success) {
                    const count = data.count || 0;
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px 20px;">
                            <div style="font-size: 48px; margin-bottom: 16px;">✅</div>
                            <p style="color: #10b981; font-size: 16px;">AI分析完成！</p>
                            <p style="color: #a3a3a3; margin-top: 8px;">成功提取 ${count} 条记忆</p>
                            <button onclick="loadMemoryTab()" style="margin-top: 16px; background: #222; border: 1px solid #333; color: #fff; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 12px;">查看记忆列表</button>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px 20px;">
                            <div style="font-size: 36px; margin-bottom: 12px;">❌</div>
                            <p style="color: #f44336; font-size: 14px;">分析失败: ${data.message || '未知错误'}</p>
                            <button onclick="loadMemoryTab()" style="margin-top: 16px; background: #222; border: 1px solid #333; color: #fff; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 12px;">返回</button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('AI分析记忆失败:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px;">
                        <div style="font-size: 36px; margin-bottom: 12px;">❌</div>

        async function showFootprints(characterId, characterName) {
            if (characterId && characterName) {
                currentMemoryCharacter = { id: characterId, name: characterName };

            if (!currentMemoryCharacter) return;
            selectedMemoryIds = [];
            
            const targetContainer = document.getElementById('memoryTabContent') || document.getElementById('memoryPanelBody');

            try {
                const [eventsResponse, configResponse] = await Promise.all([
                    fetch(`${API_BASE}/api/memory-events/list/${currentMemoryCharacter.id}?user_id=${USER_ID}`),
                    fetch(`${API_BASE}/api/footprint-config/get/${currentMemoryCharacter.id}?user_id=${USER_ID}`)
                ]);
                
                const eventsData = await eventsResponse.json();
                const configData = await configResponse.json();
                
                if (!eventsData.success) {
                    targetContainer.innerHTML = `<p style="color: #f44336;">加载足迹失败: ${eventsData.message}</p>`;
                    return;
                }
                
                const config = configData.config || { auto_extract_enabled: false, context_limit: 50, extract_interval: 5 };
                const events = eventsData.events || [];
                
                const locations = events.filter(e => e.event_type === 'location' || (e.tags || []).includes('location'));
                const persons = events.filter(e => (e.event_type === 'person' || (e.tags || []).includes('person')) && !locations.includes(e));
                const items = events.filter(e => (e.event_type === 'item' || (e.tags || []).includes('item')) && !locations.includes(e) && !persons.includes(e));
                const discoveries = events.filter(e => (e.event_type === 'discovery' || (e.tags || []).includes('discovery')) && !locations.includes(e) && !persons.includes(e) && !items.includes(e));
                const entityIds = new Set([...locations, ...persons, ...items, ...discoveries].map(e => e.id));
                const mainEvents = events.filter(e => !entityIds.has(e.id) && e.event_type === 'main');
                const sideEvents = events.filter(e => !entityIds.has(e.id) && e.event_type !== 'main');
                
                const isCategoryView = currentFootprintView === 'category';

                let html = `

                                <button onclick="showAddFootprintForm()" style="background: #222; border: 1px solid #333; color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; transition: all 0.2s;" onmouseover="this.style.background='#2a2a2a'; this.style.borderColor='#444'" onmouseout="this.style.background='#222'; this.style.borderColor='#333'">➕ 添加</button>
                                <div style="position: relative; display: inline-block;">
                                    <button onclick="toggleSmartParseMenu()" id="smartParseBtn" style="background: linear-gradient(135deg, #2563eb, #7c3aed); border: 1px solid #4f46e5; color: #fff; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.2s; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);">🧠 智能提取 ▼</button>
                                    <div id="smartParseMenu" style="display: none; position: absolute; top: 100%; right: 0; margin-top: 6px; background: #161616; border: 1px solid #333; border-radius: 8px; padding: 8px; min-width: 220px; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.6);">
                                        <div style="color: #888; font-size: 11px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #252525;">选择提取模式</div>
                                        <button onclick="smartParse('auto')" style="display: block; width: 100%; text-align: left; background: transparent; border: none; color: #e5e5e5; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 4px; transition: all 0.15s;" onmouseover="this.style.background='#252525'" onmouseout="this.style.background='transparent'">
                                            <span style="font-size: 16px; margin-right: 8px;">⚡</span><b>自动增量</b>
                                            <div style="color: #777; font-size: 11px; margin-top: 2px;">解析最新20条消息</div>
                                        </button>
                                        <button onclick="smartParse('full')" style="display: block; width: 100%; text-align: left; background: transparent; border: none; color: #e5e5e5; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.15s;" onmouseover="this.style.background='#252525'" onmouseout="this.style.background='transparent'">
                                            <span style="font-size: 16px; margin-right: 8px;">🔍</span><b>全量深度</b>
                                            <div style="color: #777; font-size: 11px; margin-top: 2px;">重新分析所有记录</div>
                                        </button>

                                <button onclick="refreshFootprintGraph()" style="background: #1a1a1a; border: 1px solid #2a2a2a; color: #999; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; transition: all 0.2s;" onmouseover="this.style.borderColor='#444'; this.style.color='#fff'" onmouseout="this.style.borderColor='#2a2a2a'; this.style.color='#999'">🔄 刷新</button>
                                <button onclick="showContextLogView()" style="background: #1a1a1a; border: 1px solid #2a2a2a; color: #999; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; transition: all 0.2s;" onmouseover="this.style.borderColor='#444'; this.style.color='#fff'" onmouseout="this.style.borderColor='#2a2a2a'; this.style.color='#999'">📋 日志</button>

                        <div style="display: flex; gap: 0; background: #111; border-radius: 8px; padding: 3px; border: 1px solid #222; margin-bottom: 12px;">
                            <button onclick="switchFootprintView('category')" style="flex: 1; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; ${isCategoryView ? 'background: #222; color: #e5e5e5; box-shadow: 0 2px 8px rgba(0,0,0,0.3);' : 'background: transparent; color: #777;'}">

                            <button onclick="switchFootprintView('graph')" style="flex: 1; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; ${isGraphView ? 'background: #222; color: #e5e5e5; box-shadow: 0 2px 8px rgba(0,0,0,0.3);' : 'background: transparent; color: #777;'}">
                                🔗 知识图谱
                            </button>
                            <button onclick="switchFootprintView('list')" style="flex: 1; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; ${isListView ? 'background: #222; color: #e5e5e5; box-shadow: 0 2px 8px rgba(0,0,0,0.3);' : 'background: transparent; color: #777;'}">
                                📋 时间线
                            </button>
                        </div>
                        
                        <div id="footprintConfigPanel" style="display: none; margin-bottom: 12px; padding: 16px; background: #141414; border: 1px solid #252525; border-radius: 8px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                                <span style="font-size: 13px; font-weight: 600; color: #ccc;">自动提取配置</span>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #999;">

                                            style="width: 14px; height: 14px; cursor: pointer; accent-color: #fff;"
                                            onchange="toggleAutoExtract()">
                                        自动提取
                                    </label>
                                </div>
                            </div>
                            
                            <div style="display: flex; gap: 20px; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <label style="font-size: 12px; color: #888;">触发间隔</label>
                                    <input type="number" id="extractIntervalInput" value="${config.extract_interval || 5}" min="1" max="50" step="1"
                                        style="width: 60px; padding: 4px 8px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #e5e5e5; font-size: 12px;"
                                        onchange="updateExtractInterval()">
                                    <span style="font-size: 11px; color: #666;">轮</span>
                                </div>
                                
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <label style="font-size: 12px; color: #888;">上下文条数</label>
                                    <input type="number" id="contextLimitInput" value="${config.context_limit}" min="10" max="200" step="10"
                                        style="width: 60px; padding: 4px 8px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #e5e5e5; font-size: 12px;"
                                        onchange="updateContextLimit()">
                                    <span style="font-size: 11px; color: #666;">条</span>
                                </div>
                            </div>
                            
                            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #252525; display: flex; gap: 16px; font-size: 11px; color: #666; flex-wrap: wrap;">
                                <span>🏰 地点</span>
                                <span>👤 人物</span>
                                <span>🎒 物品</span>
                                <span>💡 发现</span>
                                <span>🎯 主线</span>
                                <span>📌 支线</span>
                            </div>
                        </div>
                    </div>
                    
                    <div id="footprintViewContent">
                `;
                
                if (events.length === 0) {
                    html += `
                        <div style="text-align: center; padding: 80px 20px; color: #555;">

                    `;

        function switchFootprintView(view) {

            showFootprints();
        }
        
        function renderFootprintCategoryView(locations, persons, items, discoveries, mainEvents, sideEvents) {
            let html = '';
            
            const categories = [
                { key: 'locations', icon: '🏰', label: '地点', items: locations, color: '#3b82f6' },
                { key: 'persons', icon: '👤', label: '人物', items: persons, color: '#8b5cf6' },
                { key: 'items', icon: '🎒', label: '物品', items: items, color: '#f59e0b' },
                { key: 'discoveries', icon: '💡', label: '发现', items: discoveries, color: '#10b981' },
                { key: 'mainEvents', icon: '🎯', label: '主线事件', items: mainEvents, color: '#ef4444' },
                { key: 'sideEvents', icon: '📌', label: '支线事件', items: sideEvents, color: '#6b7280' }
            ];
            
            for (const cat of categories) {
                if (cat.items.length === 0) continue;
                
                html += `
                    <div style="margin-bottom: 16px;">

        function renderFootprintTimelineView(events) {
            const sortedEvents = [...events].sort((a, b) => {
                const dateA = a.occurred_at || a.created_at;
                const dateB = b.occurred_at || b.created_at;
                return new Date(dateB) - new Date(dateA);
            });
            
            let html = '<div style="position: relative; padding-left: 20px; border-left: 2px solid #2a2a2a;">';
            
            for (let i = 0; i < sortedEvents.length; i++) {
                const event = sortedEvents[i];
                const tags = event.tags || [];
                let icon = '📌';
                let borderColor = '#555';
                
                if (tags.includes('location')) { icon = '🏰'; borderColor = '#3b82f6'; }
                else if (tags.includes('person')) { icon = '👤'; borderColor = '#8b5cf6'; }
                else if (tags.includes('item')) { icon = '🎒'; borderColor = '#f59e0b'; }
                else if (tags.includes('discovery')) { icon = '💡'; borderColor = '#10b981'; }
                else if (event.event_type === 'main') { icon = '🎯'; borderColor = '#ef4444'; }
                
                let dateStr = '';
                const date = event.occurred_at || event.created_at;
                if (date) {
                    const d = new Date(date);
                    dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                }
                
                html += `
                    <div style="position: relative; margin-bottom: 16px; margin-left: 12px;">
                        <div style="position: absolute; left: -28px; top: 6px; width: 8px; height: 8px; background: ${borderColor}; border-radius: 50%; opacity: 0.7;"></div>
                        <div style="background: #141414; border: 1px solid #222; border-left: 3px solid ${borderColor}; border-radius: 6px; padding: 10px; cursor: pointer; transition: all 0.15s;" onclick="showFootprintDetail(${event.id})" onmouseover="this.style.borderColor='#3a3a3a'; this.style.background='#161616'" onmouseout="this.style.borderColor='#222'; this.style.background='#141414'">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <div style="display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0;">
                                    <span style="font-size: 16px; flex-shrink: 0;">${icon}</span>
                                    <div style="flex: 1; min-width: 0;">
                                        <div style="font-size: 13px; font-weight: 500; color: #e5e5e5;">${event.title}</div>
                                        ${event.description ? `<div style="font-size: 11px; color: #777; line-height: 1.4; margin-top: 4px;">${event.description.length > 120 ? event.description.substring(0, 120) + '...' : event.description}</div>` : ''}
                                        <div style="font-size: 10px; color: #555; margin-top: 4px;">🕐 ${dateStr} · ★ ${event.importance || 5}</div>
                                    </div>
                                </div>
                                <div style="display: flex; gap: 3px; margin-left: 8px; flex-shrink: 0;">
                                    <button onclick="event.stopPropagation(); editFootprint(${event.id})" style="background: none; border: none; color: #666; padding: 4px; cursor: pointer; font-size: 12px; border-radius: 3px; transition: all 0.15s;" onmouseover="this.style.color='#999'; this.style.background='#222'" onmouseout="this.style.color='#666'; this.style.background='none'" title="编辑">✏️</button>
                                    <button onclick="event.stopPropagation(); deleteFootprint(${event.id})" style="background: none; border: none; color: #666; padding: 4px; cursor: pointer; font-size: 12px; border-radius: 3px; transition: all 0.15s;" onmouseover="this.style.color='#f87171'; this.style.background='#222'" onmouseout="this.style.color='#666'; this.style.background='none'" title="删除">🗑️</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            html += '</div>';
            return html;
        }
        
        function renderFootprintsByLocation(events) {
            const locationEvents = {};
            const otherEvents = [];
            
            for (const event of events) {
                const tags = event.tags || [];
                
                if (tags.includes('location')) {
                    locationEvents[event.title] = { location: event, events: [] };
                }
            }
            
            for (const event of events) {
                const tags = event.tags || [];
                let added = false;
                
                if (event.parent_event_id) {
                    for (const locTitle in locationEvents) {
                        const loc = locationEvents[locTitle];
                        if (loc.location.id === event.parent_event_id) {
                            loc.events.push(event);
                            added = true;
                            break;
                        }
                    }
                }
                
                if (!added && !tags.includes('location')) {
                    otherEvents.push(event);
                }
            }
            
            let html = '';
            
            for (const locTitle in locationEvents) {
                const locData = locationEvents[locTitle];
                const loc = locData.location;
                const eventsAtLoc = locData.events;
                
                eventsAtLoc.sort((a, b) => {
                    const dateA = a.occurred_at || a.created_at;
                    const dateB = b.occurred_at || b.created_at;
                    return new Date(dateA) - new Date(dateB);
                });
                
                const isExpanded = expandedLocations.has(loc.id);
                
                html += `
                    <div style="margin-bottom: 14px;">
                        <div style="background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s;" onclick="toggleLocation(${loc.id})" onmouseover="this.style.borderColor='#3a3a3a'; this.style.background='#1a1a1a'" onmouseout="this.style.borderColor='#2a2a2a'; this.style.background='#161616'">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span style="font-size: 16px; color: #666; transition: transform 0.2s; display: inline-block; transform: ${isExpanded ? 'rotate(90deg)' : 'rotate(0deg)'};">▶</span>
                                    <span style="font-size: 18px;">📍</span>
                                    <div>
                                        <div style="font-size: 14px; font-weight: 600; color: #e5e5e5;">${loc.title}</div>
                                        <div style="font-size: 11px; color: #666; margin-top: 2px;">${eventsAtLoc.length} 个事件</div>
                                    </div>
                                </div>
                                <div style="display: flex; gap: 4px;">
                                    <button onclick="event.stopPropagation(); editFootprint(${loc.id})" style="background: none; border: 1px solid #333; color: #888; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s;" onmouseover="this.style.borderColor='#555'; this.style.color='#ccc'" onmouseout="this.style.borderColor='#333'; this.style.color='#888'">编辑</button>
                                    <button onclick="event.stopPropagation(); addEventAtLocation(${loc.id}, '${loc.title}')" style="background: none; border: 1px solid #333; color: #888; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s;" onmouseover="this.style.borderColor='#555'; this.style.color='#ccc'" onmouseout="this.style.borderColor='#333'; this.style.color='#888'">+ 添加</button>
                                </div>
                            </div>
                            ${loc.description ? `<div style="font-size: 12px; color: #777; line-height: 1.4; margin-top: 8px; padding-left: 28px;">${loc.description.length > 100 ? loc.description.substring(0, 100) + '...' : loc.description}</div>` : ''}
                        </div>
                        <div id="location-events-${loc.id}" style="${isExpanded ? '' : 'display: none;'} margin-left: 12px; margin-top: 10px; padding-left: 20px; border-left: 2px solid #2a2a2a;">
                `;
                
                if (eventsAtLoc.length === 0) {
                    html += `
                        <div style="text-align: center; padding: 24px 16px; color: #555; font-size: 12px;">
                            暂无事件
                        </div>
                    `;
                } else {
                    for (let i = 0; i < eventsAtLoc.length; i++) {
                        const event = eventsAtLoc[i];
                        const isLast = i === eventsAtLoc.length - 1;
                        html += renderEventCard(event, isLast);
                    }
                }
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            if (otherEvents.length > 0) {
                otherEvents.sort((a, b) => {
                    const dateA = a.occurred_at || a.created_at;
                    const dateB = b.occurred_at || b.created_at;
                    return new Date(dateA) - new Date(dateB);
                });
                
                html += `
                    <div style="margin-bottom: 14px;">
                        <div style="background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 18px;">📌</span>
                                <div>
                                    <div style="font-size: 14px; font-weight: 600; color: #e5e5e5;">其他事件</div>
                                    <div style="font-size: 11px; color: #666; margin-top: 2px;">${otherEvents.length} 个未归类</div>
                                </div>
                            </div>
                        </div>
                        <div style="margin-left: 12px; margin-top: 10px; padding-left: 20px; border-left: 2px solid #2a2a2a;">
                `;
                
                for (let i = 0; i < otherEvents.length; i++) {
                    const event = otherEvents[i];
                    const isLast = i === otherEvents.length - 1;
                    html += renderEventCard(event, isLast);
                }
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            if (Object.keys(locationEvents).length === 0 && otherEvents.length === 0) {
                html += `
                    <div style="text-align: center; padding: 60px 20px; color: #555;">
                        <div style="font-size: 48px; margin-bottom: 16px; opacity: 0.6;">🗺️</div>
                        <p style="font-size: 14px; color: #666;">暂无足迹记录</p>
                        <p style="font-size: 12px; color: #444; margin-top: 8px;">点击"添加"或"AI提取"开始记录</p>
                    </div>
                `;
            }
            
            return html;
        }
        
        function renderEventCard(event, isLast = false) {
            const tags = event.tags || [];
            let icon = '📌';
            let borderColor = '#333';
            let leftBorderColor = '#555';
            
            if (tags.includes('person')) {
                icon = '👤';
                leftBorderColor = '#6b7280';
            } else if (tags.includes('item')) {
                icon = '📦';
                leftBorderColor = '#9ca3af';
            } else if (tags.includes('discovery')) {
                icon = '💡';
                leftBorderColor = '#a78bfa';
            } else if (event.event_type === 'main') {
                icon = '🎯';
                leftBorderColor = '#fbbf24';
            }
            
            let dateStr = '';
            const date = event.occurred_at || event.created_at;
            if (date) {
                const d = new Date(date);
                dateStr = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }
            
            return `
                <div style="position: relative; margin-bottom: ${isLast ? '0' : '12px'};">
                    <div style="position: absolute; left: -20px; top: 6px; width: 6px; height: 6px; background: ${leftBorderColor}; border-radius: 50%; opacity: 0.6;"></div>
                    <div style="background: #141414; border: 1px solid #252525; border-left: 3px solid ${leftBorderColor}; border-radius: 6px; padding: 10px; cursor: pointer; transition: all 0.15s ease;" onclick="showFootprintDetail(${event.id})" onmouseover="this.style.borderColor='#3a3a3a'; this.style.background='#161616'" onmouseout="this.style.borderColor='#252525'; this.style.background='#141414'">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0;">
                                <span style="font-size: 16px; flex-shrink: 0;">${icon}</span>
                                <div style="flex: 1; min-width: 0;">
                                    <div style="font-size: 13px; font-weight: 500; color: #e5e5e5; line-height: 1.3;">${event.title}</div>
                                    <div style="display: align-items: center; gap: 10px; margin-top: 4px; font-size: 11px; color: #666;">
                                        <span>🕐 ${dateStr}</span>
                                        <span>·</span>
                                        <span>★ ${event.importance || 5}</span>
                                    </div>
                                </div>
                            </div>
                            <div style="display: flex; gap: 3px; margin-left: 8px; flex-shrink: 0;">
                                <button onclick="event.stopPropagation(); editFootprint(${event.id})" style="background: none; border: none; color: #666; padding: 4px; cursor: pointer; font-size: 12px; border-radius: 3px; transition: all 0.15s;" onmouseover="this.style.color='#999'; this.style.background='#222'" onmouseout="this.style.color='#666'; this.style.background='none'" title="编辑">✏️</button>
                                <button onclick="event.stopPropagation(); deleteFootprint(${event.id})" style="background: none; border: none; color: #666; padding: 4px; cursor: pointer; font-size: 12px; border-radius: 3px; transition: all 0.15s;" onmouseover="this.color='#f87171'; this.style.background='#222'" onmouseout="this.style.color='#666'; this.style.background='none'" title="删除">🗑️</button>
                            </div>
                        </div>
                        ${event.description ? `<div style="font-size: 11px; color: #777; line-height: 1.4; margin-top: 6px; padding-left: 24px;">${event.description.length > 120 ? event.description.substring(0, 120) + '...' : event.description}</div>` : ''}
                        ${tags.filter(t => !['location', 'person', 'item', 'discovery'].includes(t)).length > 0 ? `
                            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; padding-left: 24px;">
                                ${tags.filter(t => !['location', 'person', 'item', 'discovery'].includes(t)).map(tag => `<span style="font-size: 10px; padding: 2px 6px; background: #1a1a1a; border-radius: 3px; color: #888;">#${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }
        
        function refreshFootprintGraph() {
            if (currentFootprintView === 'graph') {
                const container = document.getElementById('footprintGraphView');
                if (container) {
                    container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">🔄 刷新图谱...</div>';
