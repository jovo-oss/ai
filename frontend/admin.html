<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天系统 - 管理站</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #050508;
            --bg-primary: #0a0b10;
            --bg-card: #10111a;
            --bg-card-hover: #161825;
            --bg-input: #0d0e16;
            --border: rgba(255, 255, 255, 0.04);
            --border-accent: rgba(99, 102, 241, 0.3);
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --text-muted: #55556a;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-2: #8b5cf6;
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --info: #3b82f6;
            --info-bg: rgba(59, 130, 246, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Noto Sans SC', -apple-system, sans-serif;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.05), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .app { position: relative; z-index: 1; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .topbar-title span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 13px;
            margin-left: 8px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-btn {
            padding: 7px 16px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .topbar-btn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--border-accent);
        }

        .topbar-btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .topbar-btn.primary:hover {
            background: var(--accent-2);
            border-color: var(--accent-2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-content {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 32px 60px;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 28px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 4px;
            border: 1px solid var(--border);
            width: fit-content;
        }

        .nav-tab {
            padding: 9px 20px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
            white-space: nowrap;
        }

        .nav-tab:hover { color: var(--text-secondary); }

        .nav-tab.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: var(--border-accent);
            background: var(--bg-card-hover);
        }

        .stat-card:hover::before { opacity: 1; }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: -1px;
            line-height: 1;
        }

        .stat-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            font-family: var(--font-mono);
        }

        .stat-icon {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 20px;
            opacity: 0.3;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            background: var(--accent-glow);
            color: var(--accent);
            font-weight: 500;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .grid-3-1 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .card-body { padding: 20px; }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .module-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .module-card:hover {
            border-color: var(--border-accent);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .module-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .module-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .module-icon.core { background: rgba(99, 102, 241, 0.15); }
        .module-icon.intelligence { background: rgba(139, 92, 246, 0.15); }
        .module-icon.voice { background: rgba(34, 197, 94, 0.15); }
        .module-icon.interaction { background: rgba(245, 158, 11, 0.15); }
        .module-icon.tools { background: rgba(59, 130, 246, 0.15); }

        .module-name {
            font-size: 14px;
            font-weight: 600;
        }

        .module-version {
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .module-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .module-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .module-count {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .module-status {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        .module-status.active {
            background: var(--success-bg);
            color: var(--success);
        }

        .module-category {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .chart-container {
            width: 100%;
            height: 200px;
            position: relative;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 100%;
            padding-bottom: 24px;
        }

        .bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            max-width: 40px;
            border-radius: 4px 4px 0 0;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 2px;
        }

        .bar:hover {
            filter: brightness(1.2);
        }

        .bar-label {
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .bar-value {
            font-size: 10px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .activity-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-list::-webkit-scrollbar { width: 3px; }
        .activity-list::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .activity-item:last-child { border-bottom: none; }

        .activity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .activity-dot.message { background: var(--accent); }
        .activity-dot.memory { background: var(--success); }
        .activity-dot.event { background: var(--warning); }
        .activity-dot.log { background: var(--info); }

        .activity-content {
            flex: 1;
            min-width: 0;
        }

        .activity-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .activity-time {
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        .table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            text-align: left;
            padding: 10px 16px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .data-table td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .data-table tr:hover td {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: var(--font-mono);
        }

        .tag.success { background: var(--success-bg); color: var(--success); }
        .tag.warning { background: var(--warning-bg); color: var(--warning); }
        .tag.danger { background: var(--danger-bg); color: var(--danger); }
        .tag.info { background: var(--info-bg); color: var(--info); }

        .health-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .health-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
        }

        .health-item-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .health-item-value {
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-mono);
            word-break: break-all;
        }

        .char-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .char-bar:last-child { margin-bottom: 0; }

        .char-bar-name {
            width: 80px;
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .char-bar-track {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        .char-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width 0.5s ease;
        }

        .char-bar-count {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            width: 50px;
            text-align: right;
            flex-shrink: 0;
        }

        .btn-sm {
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
        }

        .btn-sm:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--border-accent);
        }

        .btn-sm.danger:hover {
            background: var(--danger-bg);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-sm.success:hover {
            background: var(--success-bg);
            color: var(--success);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 32px; margin-bottom: 12px; }
        .empty-state .text { font-size: 13px; }

        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            max-width: 400px;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); color: white; }
        .toast.error { background: var(--danger); color: white; }
        .toast.info { background: var(--info); color: white; }

        .version-features {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .version-feature {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .db-table-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .db-table-row:last-child { border-bottom: none; }

        .db-table-name {
            font-size: 13px;
            font-family: var(--font-mono);
            color: var(--text-primary);
        }

        .db-table-meta {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .api-key-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .api-key-row:last-child { border-bottom: none; }

        .api-key-name {
            font-size: 13px;
            font-weight: 500;
            min-width: 120px;
        }

        .api-key-spec {
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }

        .api-key-url {
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 900px) {
            .main-content { padding: 20px 16px; }
            .grid-2, .grid-3-1 { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .modules-grid { grid-template-columns: 1fr; }
            .topbar { padding: 0 16px; }
            .nav-tabs { overflow-x: auto; width: 100%; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo">A</div>
            <div class="topbar-title">
                管理站
                <span>v3.5.0</span>
            </div>
            <div class="status-dot" id="statusDot"></div>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn" onclick="refreshAll()">
                &#x21bb; 刷新
            </button>
            <button class="topbar-btn primary" onclick="window.open('/', '_blank')">
                &#x2192; 聊天系统
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('overview', this)">概览</button>
            <button class="nav-tab" onclick="switchTab('modules', this)">模块管理</button>
            <button class="nav-tab" onclick="switchTab('stats', this)">数据统计</button>
            <button class="nav-tab" onclick="switchTab('health', this)">系统健康</button>
            <button class="nav-tab" onclick="switchTab('database', this)">数据库</button>
        </div>

        <div id="tab-overview" class="tab-panel active">
            <div class="stats-grid" id="overviewStats"></div>
            <div class="grid-3-1">
                <div class="card">
                    <div class="card-header">
                        <h3>&#128200; 消息趋势（近7天）</h3>
                        <button class="btn-sm" onclick="loadMessageChart(7)">7天</button>
                    </div>
                    <div class="card-body">
                        <div class="chart-container" id="messageChart"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>&#128172; 最近活动</h3>
                    </div>
                    <div class="card-body">
                        <div class="activity-list" id="recentActivity"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-modules" class="tab-panel">
            <div class="section-title">
                &#129513; 功能模块 <span class="badge" id="moduleCount">0</span>
            </div>
            <div class="modules-grid" id="modulesGrid"></div>
        </div>

        <div id="tab-stats" class="tab-panel">
            <div class="grid-2">
                <div class="card">
                    <div class="card-header">
                        <h3>&#128100; 角色数据排行</h3>
                    </div>
                    <div class="card-body" id="characterStats"></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>&#128200; 消息趋势</h3>
                        <div style="display:flex;gap:6px;">
                            <button class="btn-sm" onclick="loadMessageChart(7)">7天</button>
                            <button class="btn-sm" onclick="loadMessageChart(14)">14天</button>
                            <button class="btn-sm" onclick="loadMessageChart(30)">30天</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="chart-container" id="messageChart2"></div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3>&#128273; API配置状态</h3>
                </div>
                <div class="card-body" id="apiKeysStatus"></div>
            </div>
        </div>

        <div id="tab-health" class="tab-panel">
            <div class="section-title">&#128736;&#65039; 系统信息</div>
            <div class="health-grid" id="healthGrid"></div>
            <div style="margin-top:24px;">
                <div class="card">
                    <div class="card-header">
                        <h3>&#127760; 版本信息</h3>
                    </div>
                    <div class="card-body" id="versionInfo"></div>
                </div>
            </div>
        </div>

        <div id="tab-database" class="tab-panel">
            <div class="grid-2">
                <div class="card">
                    <div class="card-header">
                        <h3>&#128451; 数据库表</h3>
                        <button class="btn-sm success" onclick="vacuumDatabase()">&#9889; 优化数据库</button>
                    </div>
                    <div class="card-body" id="dbTables"></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>&#128202; 数据库概览</h3>
                    </div>
                    <div class="card-body" id="dbOverview"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = window.location.origin;

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    btn.classList.add('active');
}

function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path) {
    try {
        const res = await fetch(API_BASE + path);
        return await res.json();
    } catch (e) {
        console.error('API error:', path, e);
        return { success: false, message: '请求失败: ' + e.message };
    }
}

async function loadOverview() {
    const res = await api('/api/admin/overview');
    if (!res.success) return;
    const d = res.data;
    const tc = d.total_counts;
    const ac = d.active_counts;
    const ms = d.message_stats;

    document.getElementById('overviewStats').innerHTML = `
        <div class="stat-card">
            <div class="stat-icon">&#128172;</div>
            <div class="stat-label">消息总数</div>
            <div class="stat-value">${tc.messages}</div>
            <div class="stat-sub">今日 ${ms.today} / 本周 ${ms.week}</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">&#128100;</div>
            <div class="stat-label">角色数量</div>
            <div class="stat-value">${tc.characters}</div>
            <div class="stat-sub">记忆 ${tc.memories} / 事件 ${tc.events}</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">&#128218;</div>
            <div class="stat-label">世界书条目</div>
            <div class="stat-value">${tc.worldbook_entries}</div>
            <div class="stat-sub">激活 ${ac.worldbook_entries}</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">&#128273;</div>
            <div class="stat-label">API配置</div>
            <div class="stat-value">${tc.api_configs}</div>
            <div class="stat-sub">激活 ${ac.api_configs} / 密钥 ${tc.api_keys}</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">&#129504;</div>
            <div class="stat-label">记忆节点</div>
            <div class="stat-value">${tc.memories}</div>
            <div class="stat-sub">激活 ${ac.memories}</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">&#128197;</div>
            <div class="stat-label">足迹事件</div>
            <div class="stat-value">${tc.events}</div>
            <div class="stat-sub">足迹配置 ${tc.footprint_configs}</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">&#9200;</div>
            <div class="stat-label">闹钟提醒</div>
            <div class="stat-value">${tc.alarms}</div>
            <div class="stat-sub">启用 ${ac.alarms}</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">&#128190;</div>
            <div class="stat-label">数据库大小</div>
            <div class="stat-value">${d.database.size_mb}</div>
            <div class="stat-sub">MB</div>
        </div>
    `;
}

async function loadMessageChart(days = 7) {
    const res = await api('/api/admin/message-chart?days=' + days);
    if (!res.success) return;
    const data = res.data;
    const maxVal = Math.max(...data.map(d => d.count), 1);

    const renderChart = (containerId) => {
        const el = document.getElementById(containerId);
        if (!el) return;
        el.innerHTML = `<div class="bar-chart">${data.map(d => `
            <div class="bar-item">
                <div class="bar-value">${d.count}</div>
                <div class="bar" style="height: ${Math.max((d.count / maxVal) * 100, 1)}%"></div>
                <div class="bar-label">${d.date}</div>
            </div>
        `).join('')}</div>`;
    };

    renderChart('messageChart');
    renderChart('messageChart2');
}

async function loadRecentActivity() {
    const res = await api('/api/admin/recent-activity?limit=15');
    if (!res.success) return;
    const el = document.getElementById('recentActivity');
    if (res.data.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="icon">&#128196;</div><div class="text">暂无活动记录</div></div>';
        return;
    }
    const typeLabels = { message: '消息', memory: '记忆', event: '事件', log: '日志' };
    el.innerHTML = res.data.map(a => `
        <div class="activity-item">
            <div class="activity-dot ${a.type}"></div>
            <div class="activity-content">
                <div class="activity-text">[${typeLabels[a.type] || a.type}] ${a.content_preview || a.title || a.message || ''}</div>
                <div class="activity-time">${a.character_id || ''} ${a.time ? new Date(a.time).toLocaleString('zh-CN') : ''}</div>
            </div>
        </div>
    `).join('');
}

async function loadModules() {
    const res = await api('/api/admin/modules');
    if (!res.success) return;
    const modules = res.data;
    document.getElementById('moduleCount').textContent = modules.length;

    const categoryLabels = {
        core: '核心',
        intelligence: '智能',
        voice: '语音',
        interaction: '交互',
        tools: '工具'
    };

    document.getElementById('modulesGrid').innerHTML = modules.map(m => `
        <div class="module-card" onclick="window.open('/', '_blank')">
            <div class="module-top">
                <div class="module-icon ${m.category}">${m.icon}</div>
                <div>
                    <div class="module-name">${m.name}</div>
                    <div class="module-version">${m.version}</div>
                </div>
            </div>
            <div class="module-desc">${m.description}</div>
            <div class="module-footer">
                <span class="module-count">${m.count > 0 ? m.count + ' 条记录' : '无数据'}</span>
                <span class="module-status ${m.status}">${m.status === 'active' ? '运行中' : m.status}</span>
                <span class="module-category">${categoryLabels[m.category] || m.category}</span>
            </div>
        </div>
    `).join('');
}

async function loadCharacterStats() {
    const res = await api('/api/admin/character-stats');
    if (!res.success) return;
    const el = document.getElementById('characterStats');
    if (res.data.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="icon">&#128100;</div><div class="text">暂无角色数据</div></div>';
        return;
    }
    const maxMsg = Math.max(...res.data.map(c => c.message_count), 1);
    el.innerHTML = res.data.map(c => `
        <div class="char-bar">
            <div class="char-bar-name" title="${c.character_id}">${c.character_id}</div>
            <div class="char-bar-track">
                <div class="char-bar-fill" style="width: ${(c.message_count / maxMsg) * 100}%"></div>
            </div>
            <div class="char-bar-count">${c.message_count} 条</div>
        </div>
        <div style="display:flex;gap:8px;margin:-4px 0 12px 90px;">
            <span class="tag info" style="font-size:10px;">记忆 ${c.memory_count}</span>
            <span class="tag warning" style="font-size:10px;">事件 ${c.event_count}</span>
            <span class="tag success" style="font-size:10px;">世界书 ${c.worldbook_count}</span>
        </div>
    `).join('');
}

async function loadApiKeysStatus() {
    const res = await api('/api/admin/api-keys-status');
    if (!res.success) return;
    const el = document.getElementById('apiKeysStatus');
    if (res.data.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="icon">&#128273;</div><div class="text">暂无API配置</div></div>';
        return;
    }
    el.innerHTML = res.data.map(k => `
        <div class="api-key-row">
            <div class="api-key-name">${k.name}</div>
            <span class="tag ${k.api_spec === 'OpenAI' ? 'info' : 'success'}">${k.api_spec}</span>
            <div class="api-key-url">${k.base_url}</div>
            <span class="tag ${k.has_key ? 'success' : 'danger'}">${k.has_key ? '有密钥' : '无密钥'}</span>
            <span class="tag ${k.is_active ? 'success' : 'warning'}">${k.is_active ? '激活' : '未激活'}</span>
            ${k.chat_model ? `<span class="tag info">${k.chat_model}</span>` : ''}
        </div>
    `).join('');
}

async function loadHealth() {
    const res = await api('/api/admin/health');
    if (!res.success) return;
    const d = res.data;

    const items = [
        { label: 'Python 版本', value: d.system.python_version.split(' ')[0], type: 'info' },
        { label: '运行平台', value: d.system.platform, type: 'info' },
        { label: 'CPU 核心数', value: d.system.cpu_count, type: 'info' },
        { label: '数据库状态', value: d.database.status === 'connected' ? '已连接' : d.database.status, type: d.database.status === 'connected' ? 'success' : 'danger' },
        { label: '数据库大小', value: d.database.size_mb + ' MB', type: 'info' },
        { label: '环境配置文件', value: d.environment.env_file_exists ? '存在' : '缺失', type: d.environment.env_file_exists ? 'success' : 'danger' },
        { label: '插件数量', value: d.environment.plugins_count, type: 'info' },
        { label: '服务端口', value: d.server.port, type: 'info' },
        { label: '调试模式', value: d.server.debug, type: d.server.debug === 'True' ? 'warning' : 'success' },
        { label: '检查时间', value: new Date(d.timestamp).toLocaleString('zh-CN'), type: 'info' },
    ];

    document.getElementById('healthGrid').innerHTML = items.map(i => `
        <div class="health-item">
            <div class="health-item-label">${i.label}</div>
            <div class="health-item-value"><span class="tag ${i.type}">${i.value}</span></div>
        </div>
    `).join('');
}

async function loadVersionInfo() {
    const res = await api('/api/admin/version-info');
    if (!res.success) return;
    const d = res.data;
    document.getElementById('versionInfo').innerHTML = `
        <div style="margin-bottom:16px;">
            <span style="font-size:24px;font-weight:700;font-family:var(--font-mono);color:var(--accent);">v${d.version}</span>
            <span style="font-size:12px;color:var(--text-muted);margin-left:12px;">构建于 ${d.build_date}</span>
        </div>
        <div class="version-features">
            ${d.features.map(f => `<span class="version-feature">${f}</span>`).join('')}
        </div>
    `;
}

async function loadDatabaseTables() {
    const [tablesRes, overviewRes] = await Promise.all([
        api('/api/admin/database/tables'),
        api('/api/admin/overview')
    ]);

    if (tablesRes.success) {
        document.getElementById('dbTables').innerHTML = tablesRes.data.map(t => `
            <div class="db-table-row">
                <div class="db-table-name">${t.name}</div>
                <div class="db-table-meta">
                    <span>${t.column_count} 列</span>
                    <span>${t.row_count} 行</span>
                </div>
            </div>
        `).join('');
    }

    if (overviewRes.success) {
        const d = overviewRes.data;
        const tc = d.total_counts;
        document.getElementById('dbOverview').innerHTML = `
            <div style="margin-bottom:20px;">
                <div style="font-size:32px;font-weight:700;font-family:var(--font-mono);color:var(--accent);margin-bottom:4px;">${d.database.size_mb} MB</div>
                <div style="font-size:12px;color:var(--text-muted);">数据库总大小</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="health-item"><div class="health-item-label">消息</div><div class="health-item-value">${tc.messages}</div></div>
                <div class="health-item"><div class="health-item-label">角色</div><div class="health-item-value">${tc.characters}</div></div>
                <div class="health-item"><div class="health-item-label">记忆</div><div class="health-item-value">${tc.memories}</div></div>
                <div class="health-item"><div class="health-item-label">事件</div><div class="health-item-value">${tc.events}</div></div>
                <div class="health-item"><div class="health-item-label">世界书</div><div class="health-item-value">${tc.worldbook_entries}</div></div>
                <div class="health-item"><div class="health-item-label">API配置</div><div class="health-item-value">${tc.api_configs}</div></div>
                <div class="health-item"><div class="health-item-label">闹钟</div><div class="health-item-value">${tc.alarms}</div></div>
                <div class="health-item"><div class="health-item-label">提示词</div><div class="health-item-value">${tc.prompt_templates}</div></div>
            </div>
        `;
    }
}

async function vacuumDatabase() {
    if (!confirm('确定要优化数据库吗？这将压缩数据库文件，释放空间。')) return;
    showToast('正在优化数据库...', 'info');
    const res = await api('/api/admin/database/vacuum');
    if (res.success) {
        showToast(`优化完成！节省 ${res.saved_mb} MB`, 'success');
        loadDatabaseTables();
        loadOverview();
    } else {
        showToast('优化失败: ' + res.message, 'error');
    }
}

async function refreshAll() {
    showToast('正在刷新数据...', 'info');
    await Promise.all([
        loadOverview(),
        loadMessageChart(7),
        loadRecentActivity(),
        loadModules(),
        loadCharacterStats(),
        loadApiKeysStatus(),
        loadHealth(),
        loadVersionInfo(),
        loadDatabaseTables(),
    ]);
    showToast('刷新完成', 'success');
}

async function init() {
    await Promise.all([
        loadOverview(),
        loadMessageChart(7),
        loadRecentActivity(),
        loadModules(),
        loadCharacterStats(),
        loadApiKeysStatus(),
        loadHealth(),
        loadVersionInfo(),
        loadDatabaseTables(),
    ]);
}

init();
</script>
</body>
</html>
